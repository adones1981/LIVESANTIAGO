<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámaras en Vivo Santiago de Chile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00e5ff;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand h1 span {
      color: var(--accent);
    }

    .brand p {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .time-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      color: var(--accent);
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.5rem;
      width: 100%;
      flex: 1;
    }

    .search-box {
      margin-bottom: 1.5rem;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 229, 255, 0.3);
    }

    .card-header {
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--red);
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.2); }
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>SANTIAGO <span>EN VIVO</span></h1>
      <p>Cámaras de vigilancia y tránsito en tiempo real</p>
    </div>
    <div class="time-badge">
      STGO: <span id="reloj">--:--:--</span>
    </div>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="filtro" placeholder="Buscar por sector o número...">
    </div>

    <div class="grid" id="contenedorCamaras"></div>
  </div>

  <footer>
    Santiago Live Cams • Transmisiones públicas de YouTube
  </footer>

  <script>
    const camaras = [
      { id: "ErUOGtBXhgY", titulo: "Cámara 01 - Santiago Centro" },
      { id: "_Nrt155MExU", titulo: "Cámara 02 - Eje Alameda / Providencia" },
      { id: "UpHOS_enhjI", titulo: "Cámara 03 - Vista Panorámica Oriente" },
      { id: "vXKn4qUQFMA", titulo: "Cámara 04 - Sector Costanera" },
      { id: "ulBAncoXWws", titulo: "Cámara 05 - Autopista / Flujo Vial" },
      { id: "uyt8JsITTac", titulo: "Cámara 06 - Gran Santiago Tráfico" },
      { id: "RhdmP5017VM", titulo: "Cámara 07 - Sector Cívico" },
      { id: "tmS73xQ4zVc", titulo: "Cámara 08 - Conexión Metropolitana" },
      { id: "oDErMN0_ehw", titulo: "Cámara 09 - Vista Cordillera" },
      { id: "HirKZqakDIA", titulo: "Cámara 10 - Control Urbano" },
      { id: "M_Qk3Bv0-So", titulo: "Cámara 11 - Sector Oriente" },
      { id: "itVGNflL6eo", titulo: "Cámara 12 - Panorámica Ciudad" }
    ];

    const contenedor = document.getElementById('contenedorCamaras');
    const inputFiltro = document.getElementById('filtro');

    function mostrarCamaras(texto = '') {
      contenedor.innerHTML = '';
      const filtradas = camaras.filter(c => c.titulo.toLowerCase().includes(texto.toLowerCase()));

      if (filtradas.length === 0) {
        contenedor.innerHTML = '<p style="color: var(--muted); grid-column: 1/-1; text-align: center;">No se encontraron cámaras.</p>';
        return;
      }

      filtradas.forEach(cam => {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'card';
        tarjeta.innerHTML = `
          <div class="card-header">
            <span class="card-title" title="${cam.titulo}">${cam.titulo}</span>
            <span class="badge-live"><span class="dot"></span>EN VIVO</span>
          </div>
          <div class="video-wrapper">
            <iframe 
              src="https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=0&mute=1&controls=1&rel=0" 
              title="${cam.titulo}" 
              loading="lazy" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    inputFiltro.addEventListener('input', (e) => mostrarCamaras(e.target.value));

    function actualizarReloj() {
      const opciones = { timeZone: 'America/Santiago', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('reloj').textContent = new Intl.DateTimeFormat('es-CL', opciones).format(new Date());
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    mostrarCamaras();
  </script>
</body>
</html>
