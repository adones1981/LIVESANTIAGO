<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarthCam Garden | Explorador Global</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Motor Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg: #020813;
      --accent: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.45);
      --live-red: #ff334b;
      --card-bg: rgba(10, 17, 33, 0.95);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #globeViz:active {
      cursor: grabbing;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      z-index: 30;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--accent);
      color: #07090e;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .brand-title h1 span {
      color: var(--accent);
    }

    .brand-title p {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-control:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* BARRA LATERAL DERECHA (LISTADO Y LUPA) */
    .sidebar-cams {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      width: 320px;
      max-height: calc(100vh - 2.5rem);
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      z-index: 30;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.4);
    }

    .sidebar-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title-row h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }

    .cam-counter {
      background: rgba(0, 255, 102, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 0.15rem 0.45rem;
      border-radius: 12px;
      font-weight: 700;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      gap: 0.5rem;
    }

    .search-box span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.8rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .cams-scroll-list {
      padding: 0.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: calc(100vh - 11rem);
    }

    .cams-scroll-list::-webkit-scrollbar {
      width: 6px;
    }

    .cams-scroll-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .cam-item-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .cam-item-btn:hover {
      background: rgba(0, 255, 102, 0.1);
      border-color: var(--accent);
    }

    .cam-item-btn.active {
      background: rgba(0, 255, 102, 0.15);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }

    .cam-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cam-item-city {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }

    .badge-live {
      background: rgba(255, 51, 75, 0.15);
      border: 1px solid var(--live-red);
      color: var(--live-red);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .cam-item-sub {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* OCULTAR BOTÓN ADMIN Y SUS MODALES */
    .btn-admin,
    .btn-add-cam,
    .btn-export-cam,
    .admin-modal {
      display: none !important;
    }

    .hint-overlay {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    /* REPRODUCTOR FLOTANTE */
    .player-dock {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      width: 440px;
      min-width: 280px;
      max-width: 90vw;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 14px;
      z-index: 40;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 255, 102, 0.15);
      display: none;
      flex-direction: column;
      touch-action: none;
      overflow: visible;
    }

    .player-dock.active {
      display: flex;
    }

    .player-header {
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.4);
      cursor: grab;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      gap: 0.5rem;
    }

    .player-header:active {
      cursor: grabbing;
    }

    .location-info {
      overflow: hidden;
      pointer-events: none;
    }

    .location-info h2 {
      font-size: 0.88rem;
      color: #fff;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-info p {
      font-size: 0.68rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .size-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .size-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .btn-yt-direct {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-yt-direct:hover {
      background: var(--accent);
      color: #07090e;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.2rem;
    }

    .btn-close:hover {
      color: #fff;
    }

    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      overflow: hidden;
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .resize-handle {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 10px;
      font-weight: bold;
      opacity: 0.6;
    }

    .custom-tooltip {
      background: rgba(10, 17, 33, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      pointer-events: none;
      box-shadow: 0 0 15px var(--accent-glow);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-back">← CHILE</a>
    <div class="brand-title">
      <h1>EARTH<span>CAM</span></h1>
      <p>EXPLORADOR MUNDIAL</p>
    </div>
    <button class="btn-control" id="btnToggleRotate">▶ GIRO</button>

    <!-- Elementos ocultos para evitar errores de script -->
    <button class="btn-admin" id="btnAdmin">🔒 ADMIN</button>
    <button class="btn-add-cam" id="btnToggleAdd">+ AÑADIR CÁMARA</button>
    <button class="btn-export-cam" id="btnExportCam">📋 COPIAR</button>
  </header>

  <!-- PANEL LATERAL DERECHO CON LUPA Y LISTA DESLIZABLE -->
  <aside class="sidebar-cams">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <h3>CÁMARAS GLOBALES</h3>
        <span class="cam-counter" id="camCountBadge">0</span>
      </div>
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="inputSearch" placeholder="Buscar país, ciudad o lugar...">
      </div>
    </div>
    <div class="cams-scroll-list" id="camsScrollList"></div>
  </aside>

  <div class="hint-overlay">Haz clic en los puntos verdes o en la lista para ver la señal en vivo</div>

  <div id="globeViz"></div>

  <!-- REPRODUCTOR FLOTANTE -->
  <div class="player-dock" id="playerDock">
    <div class="player-header" id="playerDragHeader">
      <div class="location-info">
        <h2 id="streamTitle">Selecciona una ciudad</h2>
        <p id="streamCoords">--° N, --° E</p>
      </div>
      <div class="header-btns">
        <a id="btnYtDirect" class="btn-yt-direct" href="#" target="_blank" title="Abrir en YouTube">↗ YT</a>
        <button class="size-btn" onclick="resizePlayer(320)">S</button>
        <button class="size-btn" onclick="resizePlayer(480)">M</button>
        <button class="size-btn" onclick="resizePlayer(660)">L</button>
        <button class="btn-close" id="btnClose">&times;</button>
      </div>
    </div>
    <div class="video-frame">
      <iframe id="streamIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="resize-handle" id="resizeHandle" title="Arrastra para agrandar">◢</div>
  </div>

  <script>
    // LISTA COMPLETA ACTUALIZADA (CHILE + MUNDO + NUEVAS RASTREADAS)
    const worldCamsIniciales = [
      // CHILE
      { id: "ErUOGtBXhgY", city: "Santiago", sector: "Centro", country: "Chile", lat: -33.4489, lng: -70.6693, desc: "Capital Nacional" },
      { id: "_Nrt155MExU", city: "Santiago", sector: "Providencia", country: "Chile", lat: -33.4260, lng: -70.6120, desc: "Eje Alameda - Providencia" },
      { id: "tmS73xQ4zVc", city: "Viña del Mar", sector: "Borde Costero", country: "Chile", lat: -33.0245, lng: -71.5518, desc: "Costanera y Playa" },
      { id: "oDErMN0_ehw", city: "Valparaíso", sector: "Puerto", country: "Chile", lat: -33.0472, lng: -71.6127, desc: "Bahía y Muelle Barón" },
      { id: "M_Qk3Bv0-So", city: "La Serena", sector: "Avenida del Mar", country: "Chile", lat: -29.9027, lng: -71.2519, desc: "Faro y Costanera" },
      { id: "HirKZqakDIA", city: "Concepción", sector: "Centro", country: "Chile", lat: -36.8270, lng: -73.0503, desc: "Biobío Urbano" },

      // SUDAMÉRICA
      { id: "NfsyRx50gAI", city: "Buenos Aires", sector: "Obelisco", country: "Argentina", lat: -34.6037, lng: -58.3816, desc: "Avenida 9 de Julio / Obelisco" },
      { id: "wyEi0OPai5g", city: "Río de Janeiro", sector: "Copacabana", country: "Brasil", lat: -22.9711, lng: -43.1822, desc: "Playa Copacabana" },

      // NORTEAMÉRICA & MÉXICO
      { id: "gj6lXqFzzbQ", city: "Ciudad de México", sector: "Zócalo", country: "México", lat: 19.4326, lng: -99.1332, desc: "Plaza de la Constitución" },
      { id: "NeHO46kDJ20", city: "Cancún", sector: "Zona Hotelera", country: "México", lat: 21.1619, lng: -86.8515, desc: "Caribe Mexicano" },
      { id: "VGnFLdQW39A", city: "Nueva York", sector: "Times Square", country: "Estados Unidos", lat: 40.7580, lng: -73.9855, desc: "Times Square 4K" },
      { id: "gDcfh-Wm0xE", city: "Las Vegas", sector: "The Strip", country: "Estados Unidos", lat: 36.1147, lng: -115.1728, desc: "The Strip Boulevard" },
      { id: "D33ZD6sRvnA", city: "Los Ángeles", sector: "Venice Beach", country: "Estados Unidos", lat: 33.9850, lng: -118.4695, desc: "Boardwalk California" },
      { id: "HongS1sx4pY", city: "Toronto", sector: "Downtown", country: "Canadá", lat: 43.6532, lng: -79.3832, desc: "CN Tower / Skyline" },

      // EUROPA & RUSIA
      { id: "4WzSxE3c0as", city: "París", sector: "Torre Eiffel", country: "Francia", lat: 48.8584, lng: 2.2945, desc: "Torre Eiffel y Campo de Marte" },
      { id: "z6BNMoj9Pyo", city: "Cannes", sector: "Boulevard de la Croisette", country: "Francia", lat: 43.5528, lng: 7.0174, desc: "Costa Azul Francesa" },
      { id: "MXmzsjABC-U", city: "Londres", sector: "Tower Bridge", country: "Reino Unido", lat: 51.5055, lng: -0.0754, desc: "Tower Bridge y Río Támesis" },
      { id: "nviU2HYj-Jc", city: "Venecia", sector: "Puente Rialto", country: "Italia", lat: 45.4371, lng: 12.3326, desc: "Gran Canal de Venecia" },
      { id: "IRqboacDNFg", city: "Berlín", sector: "Puerta de Brandeburgo", country: "Alemania", lat: 52.5163, lng: 13.3777, desc: "Puerta de Brandeburgo" },
      { id: "fUsJZTHeZn4", city: "Moscú", sector: "Plaza Roja", country: "Rusia", lat: 55.7558, lng: 37.6173, desc: "Plaza Roja y Kremlin" },

      // ASIA, ÁFRICA Y OCEANÍA
      { id: "dfVK7ld38Ys", city: "Tokio", sector: "Cruce Shibuya", country: "Japón", lat: 35.6595, lng: 139.7004, desc: "Cruce Peatonal Shibuya" },
      { id: "Q3nmOf0vusk", city: "Seúl", sector: "Centro Urbano", country: "Corea del Sur", lat: 37.5665, lng: 126.9780, desc: "Centro de Seúl" },
      { id: "UemFRPrl1hk", city: "Bangkok", sector: "Sukhumvit", country: "Tailandia", lat: 13.7563, lng: 100.5018, desc: "Avenida Sukhumvit" },
      { id: "5uZa3-RMFos", city: "Sídney", sector: "Opera House", country: "Australia", lat: -33.8688, lng: 151.2093, desc: "Bahía y Opera House" },
      { id: "jOqASqt3vVI", city: "Ciudad del Cabo", sector: "Table Mountain", country: "Sudáfrica", lat: -33.9249, lng: 18.4241, desc: "Table Mountain" }
    ];

    // Clave v4 limpia para asegurar que lea todas las cámaras nuevas
    let worldCams = worldCamsIniciales;
    localStorage.setItem('earthcam_garden_cams_v4_clean', JSON.stringify(worldCams));

    let currentSelectedCam = null;
    let isAutoRotating = false;

    const playerDock = document.getElementById('playerDock');
    const playerDragHeader = document.getElementById('playerDragHeader');
    const resizeHandle = document.getElementById('resizeHandle');
    const streamTitle = document.getElementById('streamTitle');
    const streamCoords = document.getElementById('streamCoords');
    const streamIframe = document.getElementById('streamIframe');
    const btnYtDirect = document.getElementById('btnYtDirect');
    const btnClose = document.getElementById('btnClose');
    const btnToggleRotate = document.getElementById('btnToggleRotate');

    const inputSearch = document.getElementById('inputSearch');
    const camsScrollList = document.getElementById('camsScrollList');
    const camCountBadge = document.getElementById('camCountBadge');

    // MOTOR GLOBE.GL
    const globe = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .atmosphereColor('#00ff66')
      .atmosphereAltitude(0.18)
      
      .pointsData(worldCams)
      .pointLat(d => d.lat)
      .pointLng(d => d.lng)
      .pointAltitude(0)
      .pointRadius(0.85)
      .pointColor(() => '#00ff66')
      .pointLabel(d => `
        <div class="custom-tooltip">
          <b>🟢 ${d.city}</b> (${d.country})<br/>
          <span style="color:#00ff66;">${d.sector ? d.sector + ' • ' : ''}${d.desc}</span><br/>
          <small style="color:#cbd5e1;">Haz clic para ver la señal en vivo</small>
        </div>
      `)
      .onPointClick(d => selectCamera(d))

      .ringsData(worldCams)
      .ringLat(d => d.lat)
      .ringLng(d => d.lng)
      .ringColor(() => (t) => `rgba(0, 255, 102, ${1 - t * 0.9})`)
      .ringMaxRadius(0.8)
      .ringPropagationSpeed(1.2)
      .ringRepeatPeriod(1300);

    globe.controls().autoRotate = false;
    globe.controls().autoRotateSpeed = 0.4;
    globe.pointOfView({ lat: -33.4489, lng: -70.6693, altitude: 2.2 }, 1500);

    btnToggleRotate.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      globe.controls().autoRotate = isAutoRotating;
      btnToggleRotate.textContent = isAutoRotating ? '⏸ PAUSAR' : '▶ GIRO';
      btnToggleRotate.style.borderColor = isAutoRotating ? 'var(--accent)' : 'var(--border)';
    });

    // RENDERIZAR LA LISTA LATERAL DESLIZABLE
    function renderSidebarList(filtro = '') {
      camsScrollList.innerHTML = '';
      const filtradas = worldCams.filter(c => {
        const query = filtro.toLowerCase().trim();
        return (
          c.city.toLowerCase().includes(query) ||
          c.country.toLowerCase().includes(query) ||
          (c.sector && c.sector.toLowerCase().includes(query)) ||
          (c.desc && c.desc.toLowerCase().includes(query))
        );
      });

      camCountBadge.textContent = filtradas.length;

      filtradas.forEach(cam => {
        const item = document.createElement('div');
        item.className = `cam-item-btn ${currentSelectedCam === cam ? 'active' : ''}`;
        item.innerHTML = `
          <div class="cam-item-top">
            <span class="cam-item-city">${cam.city}</span>
            <span class="badge-live">LIVE</span>
          </div>
          <span class="cam-item-sub">${cam.country} • ${cam.sector || cam.desc}</span>
        `;
        item.addEventListener('click', () => selectCamera(cam));
        camsScrollList.appendChild(item);
      });
    }

    // FILTRO EN TIEMPO REAL CON LA LUPA
    inputSearch.addEventListener('input', (e) => {
      renderSidebarList(e.target.value);
    });

    // SELECCIONAR Y MOSTRAR CÁMARA
    function selectCamera(cam) {
      currentSelectedCam = cam;
      renderSidebarList(inputSearch.value);

      // El globo gira hacia el destino
      globe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 0.95 }, 1500);

      const sectorStr = cam.sector ? `[${cam.sector}] ` : '';
      streamTitle.textContent = `${cam.city} - ${sectorStr}${cam.desc}`;
      streamCoords.textContent = `${cam.lat.toFixed(2)}° Lat, ${cam.lng.toFixed(2)}° Lng • ${cam.country}`;
      streamIframe.src = `https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=1&mute=1&controls=1&rel=0`;
      btnYtDirect.href = `https://www.youtube.com/watch?v=${cam.id}`;

      playerDock.classList.add('active');
    }

    btnClose.addEventListener('click', () => {
      playerDock.classList.remove('active');
      streamIframe.src = '';
      currentSelectedCam = null;
      renderSidebarList(inputSearch.value);
      globe.pointOfView({ altitude: 2.2 }, 1500);
    });

    // ARRASTRE DEL REPRODUCTOR
    let isDragging = false;
    let dragStartX, dragStartY, initialLeft, initialTop;

    playerDragHeader.addEventListener('mousedown', (e) => {
      if (e.target.closest('.header-btns')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      const rect = playerDock.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      playerDock.style.bottom = 'auto';
      playerDock.style.right = 'auto';
      playerDock.style.left = `${initialLeft}px`;
      playerDock.style.top = `${initialTop}px`;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;

      let newLeft = Math.max(10, Math.min(window.innerWidth - playerDock.offsetWidth - 10, initialLeft + dx));
      let newTop = Math.max(10, Math.min(window.innerHeight - playerDock.offsetHeight - 10, initialTop + dy));

      playerDock.style.left = `${newLeft}px`;
      playerDock.style.top = `${newTop}px`;
    });

    document.addEventListener('mouseup', () => { isDragging = false; });

    window.resizePlayer = function(widthPx) {
      playerDock.style.width = `${Math.min(widthPx, window.innerWidth - 40)}px`;
    };

    // REDIMENSIONAMIENTO MANUAL DEL REPRODUCTOR
    let isResizing = false;
    let resizeStartX, startWidth;

    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizeStartX = e.clientX;
      startWidth = playerDock.offsetWidth;
      e.preventDefault();
      e.stopPropagation();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const deltaX = e.clientX - resizeStartX;
      playerDock.style.width = `${Math.max(280, Math.min(window.innerWidth * 0.9, startWidth + deltaX))}px`;
    });

    document.addEventListener('mouseup', () => { isResizing = false; });

    window.addEventListener('resize', () => {
      globe.width(window.innerWidth).height(window.innerHeight);
    });

    // INICIALIZACIÓN
    renderSidebarList();
  </script>
</body>
</html>
