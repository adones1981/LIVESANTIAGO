<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarthCam Garden | Explorador Global</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <!-- Motor 3D Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg: #030712;
      --accent: #00f2fe;
      --live-red: #ff334b;
      --card-bg: rgba(10, 17, 33, 0.94);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      z-index: 30;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
      max-width: calc(100vw - 3rem);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--accent);
      color: #07090e;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .brand-title h1 span {
      color: var(--accent);
    }

    .brand-title p {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .search-city-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      gap: 0.4rem;
    }

    .search-city-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.8rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 150px;
    }

    .search-city-box input::placeholder {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .btn-search {
      background: var(--accent);
      color: #07090e;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    /* MENÚ DESPLEGABLE CIUDADES */
    .dropdown-container {
      position: relative;
    }

    .btn-dropdown {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn-dropdown:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 270px;
      max-height: 50vh;
      overflow-y: auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 50;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent);
    }

    /* ADMIN */
    .btn-admin {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;
    }

    .btn-admin.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-add-cam, .btn-export-cam {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      display: none;
      transition: all 0.2s ease;
    }

    .btn-add-cam:hover {
      background: var(--accent);
      color: #07090e;
    }

    .btn-export-cam {
      border-color: #a855f7;
      color: #d8b4fe;
      background: rgba(168, 85, 247, 0.15);
    }

    .btn-export-cam:hover {
      background: #a855f7;
      color: #fff;
    }

    /* MODAL ADMIN */
    .admin-modal {
      display: none;
      position: absolute;
      top: 5.5rem;
      left: 1.5rem;
      z-index: 35;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 1.25rem;
      width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.15);
      backdrop-filter: blur(20px);
    }

    .admin-modal.open {
      display: block;
    }

    .admin-modal h3 {
      font-size: 0.88rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-modal form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .modal-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      width: 100%;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .btn-submit-cam {
      background: var(--accent);
      color: #07090e;
      border: none;
      border-radius: 6px;
      padding: 0.6rem;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.4rem;
    }

    .hint-overlay {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    /* REPRODUCTOR FLOTANTE */
    .player-dock {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      width: 440px;
      min-width: 280px;
      max-width: 90vw;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 14px;
      z-index: 40;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 242, 254, 0.15);
      display: none;
      flex-direction: column;
      touch-action: none;
      overflow: visible;
    }

    .player-dock.active {
      display: flex;
    }

    .player-header {
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.4);
      cursor: grab;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      gap: 0.5rem;
    }

    .player-header:active {
      cursor: grabbing;
    }

    .location-info {
      overflow: hidden;
      pointer-events: none;
    }

    .location-info h2 {
      font-size: 0.88rem;
      color: #fff;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-info p {
      font-size: 0.68rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .size-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .size-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .btn-yt-direct {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-yt-direct:hover {
      background: var(--accent);
      color: #07090e;
    }

    .btn-del-cam {
      background: rgba(255, 51, 75, 0.15);
      border: 1px solid var(--live-red);
      color: var(--live-red);
      font-size: 0.68rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.2rem;
    }

    .btn-close:hover {
      color: #fff;
    }

    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      overflow: hidden;
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .resize-handle {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 10px;
      font-weight: bold;
      opacity: 0.6;
    }

    .resize-handle:hover {
      opacity: 1;
    }

    /* PIN CÁMARA WEB Y ETIQUETA EN EL GLOBO */
    .cam-marker-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.7));
      transition: transform 0.2s;
    }

    .cam-marker-box:hover {
      transform: translate(-50%, -115%) scale(1.15);
      z-index: 100;
    }

    .cam-marker-icon {
      background: rgba(10, 17, 33, 0.9);
      border: 1.5px solid var(--accent);
      color: #fff;
      font-size: 14px;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--accent);
    }

    .cam-marker-label {
      background: rgba(3, 7, 18, 0.88);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #fff;
      white-space: nowrap;
      margin-top: 3px;
      pointer-events: none;
    }

    .cam-marker-label span {
      color: var(--accent);
      font-weight: 700;
    }

    .custom-tooltip {
      background: rgba(10, 17, 33, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-back">← CHILE</a>
    <div class="brand-title">
      <h1>EARTH<span>CAM</span></h1>
      <p>EXPLORADOR MUNDIAL</p>
    </div>

    <div class="dropdown-container">
      <button class="btn-dropdown" id="btnToggleCities">📋 CIUDADES ▼</button>
      <div class="dropdown-menu" id="dropdownCities"></div>
    </div>

    <div class="search-city-box">
      <input type="text" id="inputCitySearch" placeholder="Escribe una ciudad...">
      <button class="btn-search" id="btnSearchCity">IR</button>
    </div>

    <button class="btn-admin" id="btnAdmin">🔒 ADMIN</button>
    <button class="btn-add-cam" id="btnToggleAdd">+ AÑADIR CÁMARA</button>
    <button class="btn-export-cam" id="btnExportCam" title="Copiar lista para GitHub">📋 COPIAR PARA GITHUB</button>
  </header>

  <div class="admin-modal" id="adminModal">
    <h3>
      <span>+ NUEVA CÁMARA AL GLOBO</span>
      <span style="cursor:pointer;" id="btnCloseModal">&times;</span>
    </h3>
    <form id="formAddWorldCam">
      <input type="text" id="worldCamUrl" class="modal-input" placeholder="Enlace de YouTube..." required>
      <input type="text" id="worldCamTitle" class="modal-input" placeholder="Nombre o sector (ej. Centro)" required>
      <input type="text" id="worldCamCity" class="modal-input" placeholder="Ciudad (ej. Madrid)" required>
      <input type="text" id="worldCamCountry" class="modal-input" placeholder="País (ej. España)" required>
      <button type="submit" class="btn-submit-cam" id="btnSubmitCam">GEOLOCALIZAR Y CLAVAR</button>
    </form>
  </div>

  <div class="hint-overlay">Haz clic en los íconos de cámara web 📹 para ver la transmisión en directo</div>

  <div id="globeViz"></div>

  <div class="player-dock" id="playerDock">
    <div class="player-header" id="playerDragHeader">
      <div class="location-info">
        <h2 id="streamTitle">Selecciona una ciudad</h2>
        <p id="streamCoords">--° N, --° E</p>
      </div>
      <div class="header-btns">
        <a id="btnYtDirect" class="btn-yt-direct" href="#" target="_blank" title="Abrir directo en YouTube">↗ YT</a>
        <button class="size-btn" onclick="resizePlayer(320)">S</button>
        <button class="size-btn" onclick="resizePlayer(480)">M</button>
        <button class="size-btn" onclick="resizePlayer(660)">L</button>
        <button class="btn-del-cam" id="btnDeleteCam">🗑️</button>
        <button class="btn-close" id="btnClose">&times;</button>
      </div>
    </div>
    <div class="video-frame">
      <iframe id="streamIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="resize-handle" id="resizeHandle" title="Arrastra para agrandar">◢</div>
  </div>

  <script>
    const ADMIN_PASSWORD = "9066819";

    // CÁMARAS GLOBALES CON
