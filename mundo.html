<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarthCam Garden | Orbital Explorer Light</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Motor Globe.gl estable -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.35.1/dist/globe.gl.min.js"></script>

  <style>
    :root {
      --bg: #e6ebf0;
      --accent: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.35);
      --live-red: #ff334b;
      --card-bg: rgba(13, 17, 23, 0.95);
      --border: rgba(255, 255, 255, 0.15);
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #1f2937;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #globeViz:active {
      cursor: grabbing;
    }

    /* HEADER / PANEL DE CONTROL */
    header {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      z-index: 30;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 0.65rem 1.15rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      max-width: calc(100vw - 3rem);
    }

    .btn-back {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #059669;
      padding: 0.4rem 0.75rem;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: #059669;
      color: #fff;
    }

    .brand-title h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #111827;
      line-height: 1.1;
    }

    .brand-title h1 span {
      color: #059669;
    }

    .brand-title p {
      font-size: 0.62rem;
      color: #6b7280;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px;
    }

    .search-city-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 7px;
      padding: 0.2rem 0.5rem;
      gap: 0.4rem;
    }

    .search-city-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #111827;
      font-size: 0.78rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 150px;
      user-select: text;
    }

    .search-city-box input::placeholder {
      color: #9ca3af;
      font-size: 0.72rem;
    }

    .btn-search {
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 0.3rem 0.55rem;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-control {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #374151;
      padding: 0.4rem 0.7rem;
      border-radius: 7px;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-control:hover {
      border-color: #059669;
      color: #059669;
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 310px;
      max-height: 55vh;
      overflow-y: auto;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
      z-index: 50;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      padding: 0.45rem 0.7rem;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      text-align: left;
      cursor: pointer;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(0, 255, 102, 0.12);
      color: var(--accent);
    }

    /* ADMIN & BOTONES */
    .btn-admin {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #6b7280;
      padding: 0.4rem 0.65rem;
      border-radius: 7px;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-admin.active {
      border-color: #059669;
      color: #059669;
    }

    .btn-add-cam, .btn-export-cam, .btn-reset-cam {
      background: rgba(5, 150, 105, 0.1);
      border: 1px solid #059669;
      color: #059669;
      padding: 0.4rem 0.75rem;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      display: none;
    }

    .admin-modal {
      display: none;
      position: absolute;
      top: 5.2rem;
      left: 1.5rem;
      z-index: 35;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1.15rem;
      width: 350px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
    }

    .admin-modal.open {
      display: block;
    }

    .admin-modal h3 {
      font-size: 0.85rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-modal form {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .modal-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.7rem;
      color: var(--text-bright);
      font-size: 0.78rem;
      outline: none;
      width: 100%;
      user-select: text;
    }

    .btn-submit-cam {
      background: var(--accent);
      color: #010409;
      border: none;
      border-radius: 6px;
      padding: 0.55rem;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    .hint-overlay {
      position: absolute;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(8px);
      padding: 0.45rem 1.1rem;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #059669;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
    }

    /* TARJETA FLOTANTE IDÉNTICA AL ESTILO DE LA REFERENCIA */
    .player-dock {
      position: fixed;
      bottom: 1.75rem;
      left: 1.75rem;
      width: 420px;
      min-width: 280px;
      max-width: 90vw;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 16px;
      z-index: 40;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 255, 102, 0.15);
      display: none;
      flex-direction: column;
      touch-action: none;
      overflow: visible;
      color: var(--text);
    }

    .player-dock.active {
      display: flex;
    }

    .player-header {
      padding: 0.85rem 1rem 0.6rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      cursor: grab;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .player-header:active {
      cursor: grabbing;
    }

    .live-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .live-tag::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .card-close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.15rem;
      cursor: pointer;
    }

    .card-close-btn:hover {
      color: var(--text-bright);
    }

    .location-info h2 {
      font-size: 1.1rem;
      color: var(--text-bright);
      font-weight: 700;
    }

    .location-info p {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin-top: 0.1rem;
    }

    .badges-row {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .badge-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.15rem 0.6rem;
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
    }

    /* BLOQUE DE CLIMA / ESTILO TARJETA */
    .weather-widget {
      margin: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .weather-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .weather-temp {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-bright);
      font-family: 'JetBrains Mono', monospace;
    }

    .weather-desc {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .weather-details {
      display: flex;
      gap: 0.6rem;
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
    }

    /* BOTÓN REPRODUCIR GRANDE ESTILO REFERENCIA */
    .action-play-container {
      padding: 0 1rem 1rem 1rem;
    }

    .btn-play-big {
      width: 100%;
      background: var(--accent);
      color: #010409;
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: transform 0.1s ease, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-play-big:hover {
      box-shadow: 0 0 30px var(--accent);
      transform: translateY(-1px);
    }

    .video-container-modal {
      display: none;
      margin-top: 0.75rem;
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container-modal.show {
      display: block;
    }

    .video-container-modal iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .resize-handle {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      z-index: 60;
      color: var(--accent);
      font-size: 9px;
      font-weight: bold;
      opacity: 0.6;
    }

    /* PINES Y ETIQUETAS */
    .cam-marker-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      z-index: 5;
    }

    .cam-marker-wrap:hover {
      z-index: 100;
    }

    .cam-pin {
      width: 12px;
      height: 12px;
      background: #059669;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(5, 150, 105, 0.8), 0 0 3px rgba(0, 0, 0, 0.4);
      transition: transform 0.18s ease;
    }

    .cam-marker-wrap:hover .cam-pin {
      transform: scale(1.4);
      background: var(--accent);
      border-color: #059669;
    }

    .map-city-label {
      margin-top: 3px;
      color: #1f2937;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
      pointer-events: none;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.85);
      padding: 1px 4px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-back">← CHILE</a>
    <div class="brand-title">
      <h1>ORBIT<span>CAM</span></h1>
      <p>LIVE MAP EXPLORER</p>
    </div>

    <div class="dropdown-container">
      <button class="btn-control" id="btnToggleCities">📋 CÁMARAS ▼</button>
      <div class="dropdown-menu" id="dropdownCities"></div>
    </div>

    <button class="btn-control" id="btnToggleRotate">▶ GIRO</button>

    <div class="search-city-box">
      <input type="text" id="inputCitySearch" placeholder="Buscar país o ciudad...">
      <button class="btn-search" id="btnSearchCity">IR</button>
    </div>

    <button class="btn-admin" id="btnAdmin">🔒 ADMIN</button>
    <button class="btn-add-cam" id="btnToggleAdd">+ CÁMARA</button>
    <button class="btn-reset-cam" id="btnResetCam" title="Restaurar cámaras oficiales">🔄 RESET</button>
    <button class="btn-export-cam" id="btnExportCam" title="Copiar para GitHub">📋 COPIAR</button>
  </header>

  <div class="admin-modal" id="adminModal">
    <h3>
      <span>+ NUEVA CÁMARA ORBITAL</span>
      <span style="cursor:pointer;" id="btnCloseModal">&times;</span>
    </h3>
    <form id="formAddWorldCam">
      <input type="text" id="worldCamUrl" class="modal-input" placeholder="Enlace de YouTube..." required>
      <input type="text" id="worldCamTitle" class="modal-input" placeholder="Sector (ej. Centro)" required>
      <input type="text" id="worldCamCity" class="modal-input" placeholder="Ciudad (ej. Roma)" required>
      <input type="text" id="worldCamCountry" class="modal-input" placeholder="País (ej. Italia)" required>
      <button type="submit" class="btn-submit-cam" id="btnSubmitCam">VERIFICAR Y CLAVAR</button>
    </form>
  </div>

  <div class="hint-overlay">Haz clic en cualquier pin del mapa para ver los detalles y reproducir el en vivo</div>

  <div id="globeViz"></div>

  <!-- TARJETA FLOTANTE DE REPRODUCCIÓN IDÉNTICA A LA REFERENCIA -->
  <div class="player-dock" id="playerDock">
    <div class="player-header" id="playerDragHeader">
      <div class="live-badge-row">
        <span class="live-tag">EMISORA EN VIVO</span>
        <button class="card-close-btn" id="btnClose">&times;</button>
      </div>
      <div class="location-info">
        <h2 id="streamTitle">Selecciona una ubicación</h2>
        <p id="streamCoords">--° N, --° E</p>
      </div>
      <div class="badges-row">
        <span class="badge-pill">1080p 60fps</span>
        <span class="badge-pill">YouTube Live</span>
        <span class="badge-pill" id="badgeCountry">Global</span>
      </div>
    </div>

    <!-- WIDGET DE CLIMA SIMULADO ESTILO REFERENCIA -->
    <div class="weather-widget">
      <div class="weather-left">
        <div style="font-size: 2rem;">☀️</div>
        <div>
          <div class="weather-temp" id="weatherTemp">24°C</div>
          <div class="weather-desc" id="weatherDesc">Condiciones óptimas</div>
        </div>
      </div>
      <div class="weather-details">
        <div>💧 45%</div>
        <div>💨 12km/h</div>
      </div>
    </div>

    <!-- BOTÓN REPRODUCIR Y CONTENEDOR DE VIDEO -->
    <div class="action-play-container">
      <button class="btn-play-big" id="btnPlayStream">
        ▶ REPRODUCIR
      </button>
      <div class="video-container-modal" id="videoContainerModal">
        <iframe id="streamIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
    
    <div class="resize-handle" id="resizeHandle">◢</div>
  </div>

  <script>
    const ADMIN_PASSWORD = "9066819";
    const STORAGE_KEY = "orbitcam_garden_cams_v5";

    const worldCamsIniciales = [
      { id: "ErUOGtBXhgY", city: "Santiago", sector: "Plaza Baquedano", country: "Chile", lat: -33.4372, lng: -70.6345, desc: "Galería CIMA - Zona Cero" },
      { id: "_Nrt155MExU", city: "Santiago", sector: "Providencia", country: "Chile", lat: -33.4172, lng: -70.6067, desc: "Vista Costanera / Providencia" },
      { id: "tmS73xQ4zVc", city: "Lo Barnechea", sector: "Valle Nevado", country: "Chile", lat: -33.3547, lng: -70.2498, desc: "Valle Nevado Ski Resort (Cordillera)" },
      { id: "7dc4Y_Vb_Wc", city: "Río de Janeiro", sector: "Copacabana", country: "Brasil", lat: -22.9711, lng: -43.1822, desc: "Avenida Atlântica y Playa Copacabana" },
      { id: "JQ_jwk_7OVE", city: "Nueva York", sector: "Times Square", country: "Estados Unidos", lat: 40.7580, lng: -73.9855, desc: "EarthCam: Times Square 4K" },
      { id: "EO_1LWqsCNE", city: "Los Ángeles", sector: "Venice Beach", country: "Estados Unidos", lat: 33.9850, lng: -118.4695, desc: "Venice Beach Boardwalk Live" },
      { id: "mt7uE-n0YPI", city: "Venecia", sector: "Gran Canal", country: "Italia", lat: 45.4380, lng: 12.3359, desc: "Puente de Rialto y Gran Canal" },
      { id: "KGuCGd726RA", city: "Londres", sector: "Abbey Road", country: "Reino Unido", lat: 51.5320, lng: -0.1773, desc: "EarthCam: Cruce de Abbey Road" },
      { id: "ydYDqZQpim8", city: "Dublín", sector: "Temple Bar", country: "Irlanda", lat: 53.3454, lng: -6.2643, desc: "EarthCam: Centro Histórico Temple Bar" },
      { id: "dfVK7ld38Ys", city: "Tokio", sector: "Shinjuku / Kabukicho", country: "Japón", lat: 35.6938, lng: 139.7034, desc: "Distrito Shinjuku en vivo" }
    ];

    const traduccionPaises = {
      "Chile": "Chile", "Argentina": "Argentina", "Peru": "Perú", "Brazil": "Brasil",
      "United States of America": "Estados Unidos", "France": "Francia", "Spain": "España",
      "United Kingdom": "Reino Unido", "Ireland": "Irlanda", "Italy": "Italia", "Japan": "Japón"
    };

    localStorage.removeItem('orbitcam_garden_cams_v4');
    let worldCams = JSON.parse(localStorage.getItem(STORAGE_KEY)) || worldCamsIniciales;
    let isAdmin = sessionStorage.getItem('is_admin') === 'true';
    let currentSelectedCam = null;
    let isAutoRotating = false;

    const playerDock = document.getElementById('playerDock');
    const playerDragHeader = document.getElementById('playerDragHeader');
    const resizeHandle = document.getElementById('resizeHandle');
    const streamTitle = document.getElementById('streamTitle');
    const streamCoords = document.getElementById('streamCoords');
    const badgeCountry = document.getElementById('badgeCountry');
    const streamIframe = document.getElementById('streamIframe');
    const videoContainerModal = document.getElementById('videoContainerModal');
    const btnPlayStream = document.getElementById('btnPlayStream');
    const btnClose = document.getElementById('btnClose');

    const btnToggleCities = document.getElementById('btnToggleCities');
    const dropdownCities = document.getElementById('dropdownCities');
    const btnToggleRotate = document.getElementById('btnToggleRotate');
    const inputCitySearch = document.getElementById('inputCitySearch');
    const btnSearchCity = document.getElementById('btnSearchCity');

    const btnAdmin = document.getElementById('btnAdmin');
    const btnToggleAdd = document.getElementById('btnToggleAdd');
    const btnResetCam = document.getElementById('btnResetCam');
    const btnExportCam = document.getElementById('btnExportCam');
    const adminModal = document.getElementById('adminModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const formAddWorldCam = document.getElementById('formAddWorldCam');
    const btnSubmitCam = document.getElementById('btnSubmitCam');

    function norm(str) {
      return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    function buildMarkerData(cams) {
      const seenCities = new Set();
      return cams.map(cam => {
        const key = `${norm(cam.city)}_${norm(cam.country)}`;
        const showCityLabel = !seenCities.has(key);
        seenCities.add(key);
        return { ...cam, showCityLabel };
      });
    }

    // MAPA ESTILO CLARO (LIGHT THEME MAP)
    const globe = Globe()
      (document.getElementById('globeViz'))
      .backgroundColor('#e6ebf0')
      .showGlobe(true)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .atmosphereColor('#059669')
      .atmosphereAltitude(0.12)

      .htmlElementsData(buildMarkerData(worldCams))
      .htmlLat(d => d.lat)
      .htmlLng(d => d.lng)
      .htmlAltitude(0.004)
      .htmlElement(d => {
        const wrap = document.createElement('div');
        wrap.className = 'cam-marker-wrap';

        const pin = document.createElement('div');
        pin.className = 'cam-pin';
        wrap.appendChild(pin);

        if (d.showCityLabel) {
          const label = document.createElement('div');
          label.className = 'map-city-label';
          label.textContent = d.city;
          wrap.appendChild(label);
        }

        wrap.addEventListener('click', (e) => {
          e.stopPropagation();
          selectCamera(d);
        });

        return wrap;
      })

      .ringsData(buildMarkerData(worldCams).filter(d => d.showCityLabel))
      .ringLat(d => d.lat)
      .ringLng(d => d.lng)
      .ringAltitude(0.003)
      .ringColor(() => (t) => `rgba(5, 150, 105, ${1 - t * 0.8})`)
      .ringMaxRadius(1.2)
      .ringPropagationSpeed(1.2)
      .ringRepeatPeriod(1500);

    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(countries => {
        globe.polygonsData(countries.features)
          .polygonAltitude(0.002)
          .polygonCapColor(() => '#f3f4f6')
          .polygonSideColor(() => '#e5e7eb')
          .polygonStrokeColor(() => '#d1d5db')
          .polygonLabel(({ properties: d }) => {
            const nombrePais = traduccionPaises[d.ADMIN] || d.NAME_ES || d.ADMIN;
            return `<div style="background:#fff; padding:2px 6px; border-radius:4px; font-size:11px; border:1px solid #ccc; color:#333;"><b>🌍 ${nombrePais}</b></div>`;
          });
      });

    globe.controls().autoRotate = false;
    globe.controls().autoRotateSpeed = 0.4;
    globe.pointOfView({ lat: -33.4489, lng: -70.6693, altitude: 2.1 }, 1500);

    btnToggleRotate.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      globe.controls().autoRotate = isAutoRotating;
      btnToggleRotate.textContent = isAutoRotating ? '⏸ PAUSAR' : '▶ GIRO';
    });

    function refreshGlobeData() {
      const markerData = buildMarkerData(worldCams);
      globe.htmlElementsData(markerData);
      globe.ringsData(markerData.filter(d => d.showCityLabel));
      renderDropdownCities();
    }

    function renderDropdownCities() {
      dropdownCities.innerHTML = '';
      worldCams.forEach(cam => {
        const item = document.createElement('button');
        item.className = 'dropdown-item';
        const label = cam.sector ? `${cam.city} (${cam.sector})` : cam.city;
        item.innerHTML = `<span>🟢 ${label}</span> <small style="color:var(--muted);">${cam.country}</small>`;
        item.addEventListener('click', () => {
          dropdownCities.classList.remove('open');
          selectCamera(cam);
        });
        dropdownCities.appendChild(item);
      });
    }

    btnToggleCities.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownCities.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownCities.contains(e.target) && e.target !== btnToggleCities) {
        dropdownCities.classList.remove('open');
      }
    });

    function selectCamera(cam) {
      currentSelectedCam = cam;
      globe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 0.85 }, 1500);

      streamTitle.textContent = `${cam.city}`;
      streamCoords.textContent = `${cam.sector ? cam.sector + ' • ' : ''}${cam.desc}`;
      badgeCountry.textContent = cam.country;
      
      videoContainerModal.classList.remove('show');
      streamIframe.src = '';
      btnPlayStream.innerHTML = '▶ REPRODUCIR';

      playerDock.classList.add('active');
    }

    btnPlayStream.addEventListener('click', () => {
      if (!currentSelectedCam) return;
      streamIframe.src = `https://www.youtube-nocookie.com/embed/${currentSelectedCam.id}?autoplay=1&mute=1&controls=1&rel=0`;
      videoContainerModal.classList.add('show');
      btnPlayStream.innerHTML = '⏸ REPRODUCIENDO EN VIVO';
    });

    btnClose.addEventListener('click', () => {
      playerDock.classList.remove('active');
      streamIframe.src = '';
      videoContainerModal.classList.remove('show');
      currentSelectedCam = null;
      globe.pointOfView({ altitude: 2.1 }, 1500);
    });

    // DRAG DE LA VENTANA FLOTANTE
    let isDragging = false;
    let dragStartX, dragStartY, initialLeft, initialTop;

    playerDragHeader.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      const rect = playerDock.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      playerDock.style.bottom = 'auto';
      playerDock.style.right = 'auto';
      playerDock.style.left = `${initialLeft}px`;
      playerDock.style.top = `${initialTop}px`;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      playerDock.style.left = `${initialLeft + dx}px`;
      playerDock.style.top = `${initialTop + dy}px`;
    });

    document.addEventListener('mouseup', () => { isDragging = false; });

    async function searchAndFlyToLocation(rawQuery) {
      const q = norm(rawQuery);
      if (!q) return;

      const exactMatch = worldCams.find(c => norm(c.city) === q || norm(c.country) === q || norm(c.sector) === q);
      if (exactMatch) {
        selectCamera(exactMatch);
        return;
      }

      const url = `https://nominatim.openstreetmap.org/search?format=json&accept-language=es&limit=1&q=${encodeURIComponent(rawQuery.trim())}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.length > 0) {
        globe.pointOfView({ lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), altitude: 1.2 }, 1800);
      } else {
        alert('No se encontró la ubicación.');
      }
    }

    btnSearchCity.addEventListener('click', () => searchAndFlyToLocation(inputCitySearch.value));
    inputCitySearch.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchAndFlyToLocation(inputCitySearch.value);
    });

    function extractYouTubeID(url) {
      if (url.length === 11 && !url.includes('/')) return url;
      const match = url.trim().match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    btnAdmin.addEventListener('click', () => {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem('is_admin');
        actualizarVistaAdmin();
      } else {
        const pass = prompt('Contraseña de administrador:');
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          sessionStorage.setItem('is_admin', 'true');
          actualizarVistaAdmin();
        }
      }
    });

    function actualizarVistaAdmin() {
      if (isAdmin) {
        btnAdmin.textContent = '🔓 CERRAR';
        btnAdmin.classList.add('active');
        btnToggleAdd.style.display = 'inline-block';
        btnResetCam.style.display = 'inline-block';
        btnExportCam.style.display = 'inline-block';
      } else {
        btnAdmin.textContent = '🔒 ADMIN';
        btnAdmin.classList.remove('active');
        btnToggleAdd.style.display = 'none';
        btnResetCam.style.display = 'none';
        btnExportCam.style.display = 'none';
        adminModal.classList.remove('open');
      }
    }

    btnResetCam.addEventListener('click', () => {
      if (confirm('¿Restaurar cámaras oficiales?')) {
        localStorage.removeItem(STORAGE_KEY);
        worldCams = [...worldCamsIniciales];
        refreshGlobeData();
        btnClose.click();
      }
    });

    btnExportCam.addEventListener('click', () => {
      navigator.clipboard.writeText(`const worldCamsIniciales = ${JSON.stringify(worldCams, null, 2)};`).then(() => {
        alert('¡Copiado al portapapeles!');
      });
    });

    btnToggleAdd.addEventListener('click', () => adminModal.classList.toggle('open'));
    btnCloseModal.addEventListener('click', () => adminModal.classList.remove('open'));

    formAddWorldCam.addEventListener('submit', async (e) => {
      e.preventDefault();
      const videoId = extractYouTubeID(document.getElementById('worldCamUrl').value);
      if (!videoId) return alert('Enlace de YouTube no válido.');

      const desc = document.getElementById('worldCamTitle').value.trim();
      const city = document.getElementById('worldCamCity').value.trim();
      const country = document.getElementById('worldCamCountry').value.trim();

      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=es&limit=1&q=${encodeURIComponent(`${city},${country}`)}`);
      const data = await res.json();

      if (data && data.length > 0) {
        const newCam = { id: videoId, city, sector: desc, country, lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), desc };
        worldCams.unshift(newCam);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(worldCams));
        refreshGlobeData();
        adminModal.classList.remove('open');
        selectCamera(newCam);
      } else {
        alert('No se pudo geolocalizar.');
      }
    });

    window.addEventListener('resize', () => globe.width(window.innerWidth).height(window.innerHeight));

    refreshGlobeData();
    actualizarVistaAdmin();
  </script>
</body>
</html>
