<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Live Cams | Explorador 3D Global</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Dependencias 3D Globe -->
  <script src="//unpkg.com/three"></script>
  <script src="//unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 21, 35, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00e5ff;
      --live-red: #ff334b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(10, 15, 26, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }

    .brand-logo {
      width: 34px; height: 34px; border-radius: 8px;
      background: rgba(0, 229, 255, 0.1); border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
    }

    .brand-logo svg { width: 18px; height: 18px; fill: var(--accent); }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.2; }
    .brand-text h1 span { color: var(--accent); }

    .btn-chile {
      background: linear-gradient(135deg, rgba(0, 255, 204, 0.15), rgba(0, 229, 255, 0.25));
      border: 1px solid var(--accent);
      color: #fff; padding: 0.45rem 0.95rem; border-radius: 8px;
      font-size: 0.8rem; font-weight: 700; text-decoration: none;
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace; transition: all 0.25s ease;
    }

    .btn-chile:hover { background: var(--accent); color: #07090e; }

    /* RADIO DELOREAN */
    .mini-radio-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .mini-radio-title {
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .mini-radio-screen {
      background: #0d0d0d;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 3px 6px;
      width: 190px;
      overflow: hidden;
      white-space: nowrap;
    }

    .mini-marquee {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      color: #ff334b;
      padding-left: 100%;
      animation: mini-scroll 16s linear infinite;
    }

    @keyframes mini-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .btn-radio-play {
      background: var(--accent);
      color: #050811;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 0.7rem;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-vol-slider { width: 50px; height: 4px; accent-color: var(--accent); cursor: pointer; }

    .mini-stations-group {
      display: flex;
      gap: 3px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      padding-left: 6px;
    }

    .btn-mini-station {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 0.58rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
    }

    .btn-mini-station.active {
      background: var(--accent);
      color: #050811;
      border-color: var(--accent);
      font-weight: bold;
    }

    /* CONTENEDOR 3D */
    #globeViz {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* BARRA LATERAL DERECHA DE CÁMARAS DEL MUNDO */
    .sidebar-cams {
      position: absolute;
      right: 1.25rem;
      top: 5rem;
      bottom: 2rem;
      width: 320px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .sidebar-head {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-head span { color: var(--accent); }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .sidebar-list::-webkit-scrollbar { width: 5px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .world-cam-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px;
      transition: all 0.2s ease;
    }

    .world-cam-card:hover, .world-cam-card.active {
      border-color: var(--accent);
      background: rgba(0, 229, 255, 0.08);
      transform: translateX(-2px);
    }

    .world-thumb {
      width: 75px;
      height: 48px;
      border-radius: 5px;
      object-fit: cover;
    }

    .world-info {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .world-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .world-location {
      font-size: 0.65rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    /* REPRODUCTOR FLOTANTE PARA TRANSMISIÓN MUNDIAL */
    .floating-player-box {
      position: absolute;
      bottom: 2rem;
      left: 1.5rem;
      width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 10px 40px rgba(0, 229, 255, 0.25);
      display: none;
    }

    .floating-player-header {
      padding: 0.5rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid var(--border);
    }

    .floating-player-header span {
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-close-float {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
    }
    .btn-close-float:hover { color: #fff; }

    .floating-iframe-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .floating-iframe-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    #radioHiddenPlayer {
      position: absolute;
      top: -1000px;
      left: -1000px;
      width: 1px;
      height: 1px;
    }

    @media (max-width: 768px) {
      .sidebar-cams { width: calc(100% - 2.5rem); height: 220px; top: auto; bottom: 1rem; }
      .floating-player-box { width: calc(100% - 3rem); left: 1.5rem; bottom: 240px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg></div>
      <div class="brand-text">
        <h1>MUNDO <span>EN VIVO</span></h1>
      </div>

      <!-- MINI RADIO DELOREAN -->
      <div class="mini-radio-bar">
        <span class="mini-radio-title">⚡ RADIO DELOREAN</span>
        <div class="mini-radio-screen">
          <div class="mini-marquee">
            RADIO DELOREAN LA RADIO DEL FUTURO - CLASICOS DE LOS 80S Y 90S - MUSICA 24/7 ⚡
          </div>
        </div>
        <button class="btn-radio-play" id="btnMiniRadioPlay" onclick="toggleMiniRadio()" title="Reproducir / Pausar">▶</button>
        <input type="range" class="mini-vol-slider" id="miniRadioVol" min="0" max="100" value="50" title="Volumen">
        
        <div class="mini-stations-group">
          <button class="btn-mini-station active" id="btn_st_BuB9SaS2cWE" onclick="switchMiniStation('BuB9SaS2cWE', this)">1985</button>
          <button class="btn-mini-station" id="btn_st_Nt27aBceerI" onclick="switchMiniStation('Nt27aBceerI', this)">ROCK</button>
          <button class="btn-mini-station" id="btn_st_34H1XIjnfKM" onclick="switchMiniStation('34H1XIjnfKM', this)">TECHNO</button>
          <button class="btn-mini-station" id="btn_st_8UM7FNEbiYs" onclick="switchMiniStation('8UM7FNEbiYs', this)">1955</button>
          <button class="btn-mini-station" id="btn_st_3LWMFjRZQ6k" onclick="switchMiniStation('3LWMFjRZQ6k', this)">METAL</button>
          <button class="btn-mini-station" id="btn_st_TSyjyTGoDro" onclick="switchMiniStation('TSyjyTGoDro', this)">1885</button>
        </div>
      </div>

      <div id="radioHiddenPlayer"></div>
    </div>

    <!-- BOTÓN VOLVER A CHILE -->
    <a href="index.html" class="btn-chile">🇨🇱 VOLVER A CHILE</a>
  </header>

  <!-- CONTENEDOR 3D DEL GLOBO -->
  <div id="globeViz"></div>

  <!-- LISTA LATERAL DE CÁMARAS DEL MUNDO -->
  <aside class="sidebar-cams">
    <div class="sidebar-head">
      <span>🌍 CÁMARAS MUNDIALES</span>
      <small style="color:var(--muted); font-size:0.65rem;">EN VIVO</small>
    </div>
    <div class="sidebar-list" id="worldCamsList"></div>
  </aside>

  <!-- REPRODUCTOR FLOTANTE -->
  <div class="floating-player-box" id="floatingPlayerBox">
    <div class="floating-player-header">
      <span id="floatCamTitle">Transmisión</span>
      <button class="btn-close-float" onclick="cerrarReproductorFlotante()">&times;</button>
    </div>
    <div class="floating-iframe-wrap">
      <iframe id="floatCamIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    /* CÁMARAS INTERNACIONALES (COORDENADAS LAT / LNG) */
    const camarasMundo = [
      { id: "1-iS7_G1978", titulo: "Times Square", ciudad: "Nueva York", pais: "EE.UU.", lat: 40.7580, lng: -73.9855 },
      { id: "DDU-rZs-Ic4", titulo: "Torre Eiffel Panorámica", ciudad: "París", pais: "Francia", lat: 48.8584, lng: 2.2945 },
      { id: "w_MsnGffp0U", titulo: "Cruce de Shibuya", ciudad: "Tokio", pais: "Japón", lat: 35.6595, lng: 139.7005 },
      { id: "49936C_mD18", titulo: "Venecia Gran Canal", ciudad: "Venecia", pais: "Italia", lat: 45.4408, lng: 12.3155 },
      { id: "51O_5zP0eXo", titulo: "Playa de Copacabana", ciudad: "Río de Janeiro", pais: "Brasil", lat: -22.9711, lng: -43.1822 },
      { id: "mRe-5144c4g", titulo: "Coliseo Romano", ciudad: "Roma", pais: "Italia", lat: 41.8902, lng: 12.4922 },
      { id: "gK6A0K2zQz4", titulo: "Plaza Mayor", ciudad: "Madrid", pais: "España", lat: 40.4154, lng: -3.7074 },
      { id: "vXKn4qUQFMA", titulo: "Santiago Providencia", ciudad: "Santiago", pais: "Chile", lat: -33.4489, lng: -70.6693 }
    ];

    /* INICIALIZAR EL GLOBO 3D (GLOBE.GL) */
    let worldGlobe;
    function initGlobe() {
      const elem = document.getElementById('globeViz');
      worldGlobe = Globe()(elem)
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .pointsData(camarasMundo)
        .pointLat('lat')
        .pointLng('lng')
        .pointColor(() => '#00e5ff')
        .pointAltitude(0.06)
        .pointRadius(0.8)
        .pointLabel(d => `<b>${d.titulo}</b> (${d.ciudad}, ${d.pais})`)
        .onPointClick(point => {
          abrirCamaraMundo(point);
          worldGlobe.pointOfView({ lat: point.lat, lng: point.lng, altitude: 1.5 }, 1200);
        });

      // Configuración de cámara inicial apuntando a América
      worldGlobe.pointOfView({ lat: 10, lng: -60, altitude: 2.2 });
      worldGlobe.controls().autoRotate = true;
      worldGlobe.controls().autoRotateSpeed = 0.4;
    }

    /* RENDER DE LA LISTA LATERAL */
    const listEl = document.getElementById('worldCamsList');
    function renderWorldList() {
      listEl.innerHTML = '';
      camarasMundo.forEach(cam => {
        const item = document.createElement('div');
        item.className = 'world-cam-card';
        item.innerHTML = `
          <img class="world-thumb" src="https://img.youtube.com/vi/${cam.id}/mqdefault.jpg">
          <div class="world-info">
            <span class="world-title" title="${cam.titulo}">${cam.titulo}</span>
            <span class="world-location">${cam.ciudad}, ${cam.pais}</span>
          </div>
        `;
        item.addEventListener('click', () => {
          abrirCamaraMundo(cam);
          if (worldGlobe) {
            worldGlobe.controls().autoRotate = false;
            worldGlobe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 1.5 }, 1200);
          }
        });
        listEl.appendChild(item);
      });
    }

    /* REPRODUCTOR FLOTANTE */
    const floatBox = document.getElementById('floatingPlayerBox');
    const floatTitle = document.getElementById('floatCamTitle');
    const floatIframe = document.getElementById('floatCamIframe');

    function abrirCamaraMundo(cam) {
      floatTitle.textContent = `${cam.titulo.toUpperCase()} (${cam.ciudad})`;
      floatIframe.src = `https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=1&mute=1&rel=0`;
      floatBox.style.display = 'block';
    }

    function cerrarReproductorFlotante() {
      floatBox.style.display = 'none';
      floatIframe.src = '';
      if (worldGlobe) worldGlobe.controls().autoRotate = true;
    }

    /* RADIO DELOREAN */
    let radioAudioPlayer = null;
    let currentStationId = localStorage.getItem('radio_delorean_station') || 'BuB9SaS2cWE';
    let savedVol = parseInt(localStorage.getItem('radio_delorean_vol') || '50', 10);
    let shouldAutoPlay = localStorage.getItem('radio_delorean_playing') === 'true';

    (function initRadioApi() {
      const ytScript = document.createElement('script');
      ytScript.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(ytScript);
    })();

    window.onYouTubeIframeAPIReady = function() {
      radioAudioPlayer = new YT.Player('radioHiddenPlayer', {
        height: '1', width: '1', videoId: currentStationId,
        playerVars: { autoplay: shouldAutoPlay ? 1 : 0, controls: 0 },
        events: { 
          'onReady': () => {
            radioAudioPlayer.setVolume(savedVol);
            document.getElementById('miniRadioVol').value = savedVol;
            if (shouldAutoPlay) {
              radioAudioPlayer.playVideo();
              document.getElementById('btnMiniRadioPlay').textContent = '⏸';
            }
            actualizarBotonEstacion(currentStationId);
          } 
        }
      });
    };

    function toggleMiniRadio() {
      if (!radioAudioPlayer || typeof radioAudioPlayer.getPlayerState !== 'function') return;
      const btn = document.getElementById('btnMiniRadioPlay');
      if (radioAudioPlayer.getPlayerState() === 1) {
        radioAudioPlayer.pauseVideo();
        btn.textContent = '▶';
        localStorage.setItem('radio_delorean_playing', 'false');
      } else {
        radioAudioPlayer.playVideo();
        btn.textContent = '⏸';
        localStorage.setItem('radio_delorean_playing', 'true');
      }
    }

    function switchMiniStation(videoId, btnEl) {
      currentStationId = videoId;
      localStorage.setItem('radio_delorean_station', videoId);
      const btnPlay = document.getElementById('btnMiniRadioPlay');

      if (radioAudioPlayer && typeof radioAudioPlayer.loadVideoById === 'function') {
        radioAudioPlayer.loadVideoById(videoId);
        btnPlay.textContent = '⏸';
        localStorage.setItem('radio_delorean_playing', 'true');
      }
      actualizarBotonEstacion(videoId);
    }

    function actualizarBotonEstacion(videoId) {
      document.querySelectorAll('.btn-mini-station').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn_st_' + videoId);
      if (activeBtn) activeBtn.classList.add('active');
    }

    document.getElementById('miniRadioVol').addEventListener('input', (e) => {
      const vol = e.target.value;
      localStorage.setItem('radio_delorean_vol', vol);
      if (radioAudioPlayer && typeof radioAudioPlayer.setVolume === 'function') {
        radioAudioPlayer.setVolume(vol);
      }
    });

    window.addEventListener('resize', () => {
      if (worldGlobe) {
        worldGlobe.width(window.innerWidth).height(window.innerHeight);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      initGlobe();
      renderWorldList();
    });
  </script>
</body>
</html>
