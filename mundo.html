<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarthCam Garden | Explorador Global</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <!-- Motor Globe.gl estable -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.35.1/dist/globe.gl.min.js"></script>

  <style>
    :root {
      --bg: #020813;
      --accent: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.45);
      --live-red: #ff334b;
      --card-bg: rgba(10, 17, 33, 0.95);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #globeViz:active {
      cursor: grabbing;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      z-index: 30;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      max-width: calc(100vw - 3rem);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--accent);
      color: #07090e;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .brand-title h1 span {
      color: var(--accent);
    }

    .brand-title p {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .search-city-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      gap: 0.4rem;
      transition: border-color 0.2s;
    }

    .search-city-box:focus-within {
      border-color: var(--accent);
    }

    .search-city-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.8rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 165px;
      user-select: text;
    }

    .search-city-box input::placeholder {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .btn-search {
      background: var(--accent);
      color: #07090e;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: transform 0.1s;
    }

    .btn-search:active {
      transform: scale(0.95);
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-control:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 310px;
      max-height: 55vh;
      overflow-y: auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 50;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.74rem;
      font-family: 'JetBrains Mono', monospace;
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(0, 255, 102, 0.15);
      color: var(--accent);
    }

    /* ADMIN */
    .btn-admin {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;
    }

    .btn-admin.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-add-cam, .btn-export-cam, .btn-reset-cam {
      background: rgba(0, 255, 102, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      display: none;
      transition: all 0.2s ease;
    }

    .btn-add-cam:hover {
      background: var(--accent);
      color: #07090e;
    }

    .btn-export-cam {
      border-color: #a855f7;
      color: #d8b4fe;
      background: rgba(168, 85, 247, 0.15);
    }

    .btn-export-cam:hover {
      background: #a855f7;
      color: #fff;
    }

    .btn-reset-cam {
      border-color: #f59e0b;
      color: #fcd34d;
      background: rgba(245, 158, 11, 0.15);
    }

    .btn-reset-cam:hover {
      background: #f59e0b;
      color: #07090e;
    }

    /* MODAL ADMIN */
    .admin-modal {
      display: none;
      position: absolute;
      top: 5.5rem;
      left: 1.5rem;
      z-index: 35;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 1.25rem;
      width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 102, 0.15);
      backdrop-filter: blur(20px);
    }

    .admin-modal.open {
      display: block;
    }

    .admin-modal h3 {
      font-size: 0.88rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-modal form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .modal-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      width: 100%;
      user-select: text;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .btn-submit-cam {
      background: var(--accent);
      color: #07090e;
      border: none;
      border-radius: 6px;
      padding: 0.6rem;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.4rem;
    }

    .hint-overlay {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* REPRODUCTOR FLOTANTE */
    .player-dock {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      width: 440px;
      min-width: 280px;
      max-width: 90vw;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 14px;
      z-index: 40;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 255, 102, 0.15);
      display: none;
      flex-direction: column;
      touch-action: none;
      overflow: visible;
    }

    .player-dock.active {
      display: flex;
    }

    .player-header {
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.4);
      cursor: grab;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      gap: 0.5rem;
    }

    .player-header:active {
      cursor: grabbing;
    }

    .location-info {
      overflow: hidden;
      pointer-events: none;
    }

    .location-info h2 {
      font-size: 0.86rem;
      color: #fff;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-info p {
      font-size: 0.66rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .size-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .size-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .btn-yt-direct {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-yt-direct:hover {
      background: var(--accent);
      color: #07090e;
    }

    .btn-del-cam {
      background: rgba(255, 51, 75, 0.15);
      border: 1px solid var(--live-red);
      color: var(--live-red);
      font-size: 0.68rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.2rem;
    }

    .btn-close:hover {
      color: #fff;
    }

    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      overflow: hidden;
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .resize-handle {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 10px;
      font-weight: bold;
      opacity: 0.6;
    }

    .custom-tooltip {
      background: rgba(10, 17, 33, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 0.4rem 0.65rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      pointer-events: none;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* PIN PLANO EN EL MAPA (SIN CILINDROS 3D) */
    .cam-marker-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      z-index: 5;
    }

    .cam-marker-wrap:hover {
      z-index: 100;
    }

    .cam-pin {
      width: 11px;
      height: 11px;
      background: var(--accent);
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent), 0 0 4px rgba(0, 0, 0, 0.9);
      transition: transform 0.18s ease, background-color 0.18s ease;
    }

    .cam-marker-wrap:hover .cam-pin {
      transform: scale(1.45);
      background: #ffffff;
      border-color: var(--accent);
    }

    /* ETIQUETA DE CIUDAD PLANA Y PEQUEÑA */
    .map-city-label {
      margin-top: 3px;
      color: rgba(241, 245, 249, 0.92);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 5px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      white-space: nowrap;
      background: rgba(2, 8, 19, 0.6);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* TOOLTIP FLOTANTE AL PASAR EL MOUSE SOBRE EL PIN */
    .pin-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 17, 33, 0.96);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 12px var(--accent-glow);
    }

    .cam-marker-wrap:hover .pin-tooltip {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-back">← CHILE</a>
    <div class="brand-title">
      <h1>EARTH<span>CAM</span></h1>
      <p>EXPLORADOR MUNDIAL</p>
    </div>

    <div class="dropdown-container">
      <button class="btn-control" id="btnToggleCities">📋 CÁMARAS EN VIVO ▼</button>
      <div class="dropdown-menu" id="dropdownCities"></div>
    </div>

    <button class="btn-control" id="btnToggleRotate">▶ GIRO</button>

    <div class="search-city-box">
      <input type="text" id="inputCitySearch" placeholder="Buscar país o ciudad...">
      <button class="btn-search" id="btnSearchCity">IR</button>
    </div>

    <button class="btn-admin" id="btnAdmin">🔒 ADMIN</button>
    <button class="btn-add-cam" id="btnToggleAdd">+ AÑADIR CÁMARA</button>
    <button class="btn-reset-cam" id="btnResetCam" title="Restaurar cámaras verificadas por defecto">🔄 RESET</button>
    <button class="btn-export-cam" id="btnExportCam" title="Copiar lista para GitHub">📋 COPIAR PARA GITHUB</button>
  </header>

  <div class="admin-modal" id="adminModal">
    <h3>
      <span>+ NUEVA CÁMARA AL GLOBO</span>
      <span style="cursor:pointer;" id="btnCloseModal">&times;</span>
    </h3>
    <form id="formAddWorldCam">
      <input type="text" id="worldCamUrl" class="modal-input" placeholder="Enlace de YouTube..." required>
      <input type="text" id="worldCamTitle" class="modal-input" placeholder="Nombre o sector (ej. Centro)" required>
      <input type="text" id="worldCamCity" class="modal-input" placeholder="Ciudad (ej. Roma)" required>
      <input type="text" id="worldCamCountry" class="modal-input" placeholder="País (ej. Italia)" required>
      <button type="submit" class="btn-submit-cam" id="btnSubmitCam">VERIFICAR Y CLAVAR</button>
    </form>
  </div>

  <div class="hint-overlay">Haz clic en cualquier pin verde para ver la cámara en vivo</div>

  <div id="globeViz"></div>

  <div class="player-dock" id="playerDock">
    <div class="player-header" id="playerDragHeader">
      <div class="location-info">
        <h2 id="streamTitle">Selecciona una ciudad</h2>
        <p id="streamCoords">--° N, --° E</p>
      </div>
      <div class="header-btns">
        <a id="btnYtDirect" class="btn-yt-direct" href="#" target="_blank" title="Abrir en YouTube">↗ YT</a>
        <button class="size-btn" onclick="resizePlayer(320)">S</button>
        <button class="size-btn" onclick="resizePlayer(480)">M</button>
        <button class="size-btn" onclick="resizePlayer(660)">L</button>
        <button class="btn-del-cam" id="btnDeleteCam">🗑️</button>
        <button class="btn-close" id="btnClose">&times;</button>
      </div>
    </div>
    <div class="video-frame">
      <iframe id="streamIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="resize-handle" id="resizeHandle" title="Arrastra para agrandar">◢</div>
  </div>

      "China": "China",
      "Australia": "Australia",
      "Russia": "Rusia",
      "Colombia": "Colombia",
      "Uruguay": "Uruguay",
      "Paraguay": "Paraguay",
      "Ecuador": "Ecuador",
      "Venezuela": "Venezuela"
    };

    // Limpiar la llave vieja defectuosa para que no interfiera nunca más
    localStorage.removeItem('earthcam_garden_cams');

    let worldCams = JSON.parse(localStorage.getItem(STORAGE_KEY)) || worldCamsIniciales;
    let isAdmin = sessionStorage.getItem('is_admin') === 'true';
    let currentSelectedCam = null;
    let isAutoRotating = false;

    const playerDock = document.getElementById('playerDock');
    const playerDragHeader = document.getElementById('playerDragHeader');
    const resizeHandle = document.getElementById('resizeHandle');
    const streamTitle = document.getElementById('streamTitle');
    const streamCoords = document.getElementById('streamCoords');
    const streamIframe = document.getElementById('streamIframe');
    const btnYtDirect = document.getElementById('btnYtDirect');
    const btnClose = document.getElementById('btnClose');

    const btnToggleCities = document.getElementById('btnToggleCities');
    const dropdownCities = document.getElementById('dropdownCities');
    const btnToggleRotate = document.getElementById('btnToggleRotate');

    const inputCitySearch = document.getElementById('inputCitySearch');
    const btnSearchCity = document.getElementById('btnSearchCity');

    const btnAdmin = document.getElementById('btnAdmin');
    const btnToggleAdd = document.getElementById('btnToggleAdd');
    const btnResetCam = document.getElementById('btnResetCam');
    const btnExportCam = document.getElementById('btnExportCam');
    const adminModal = document.getElementById('adminModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const formAddWorldCam = document.getElementById('formAddWorldCam');
    const btnSubmitCam = document.getElementById('btnSubmitCam');
    const btnDeleteCam = document.getElementById('btnDeleteCam');

    // Función para normalizar texto (quita tildes y pasa a minúsculas)
    function norm(str) {
      return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    // Marca solo 1 cámara por ciudad para mostrar etiqueta de texto y evitar duplicados superpuestos
    function buildMarkerData(cams) {
      const seenCities = new Set();
      return cams.map(cam => {
        const key = `${norm(cam.city)}_${norm(cam.country)}`;
        const showCityLabel = !seenCities.has(key);
        seenCities.add(key);
        return { ...cam, showCityLabel };
      });
    }

    // Textura de océano azul marino en memoria
    function createOceanTextureUrl() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0b4f8a';
      ctx.fillRect(0, 0, 64, 64);
      return canvas.toDataURL();
    }

    // INICIALIZACIÓN DEL GLOBO (CON PINES PLANOS HTML)
    const globe = Globe()
      (document.getElementById('globeViz'))
      .backgroundColor('#020813')
      .showGlobe(true)
      .globeImageUrl(createOceanTextureUrl())
      .atmosphereColor('#38bdf8')
      .atmosphereAltitude(0.16)

      // PINES PLANOS HTML Y ETIQUETAS DE CIUDAD
      .htmlElementsData(buildMarkerData(worldCams))
      .htmlLat(d => d.lat)
      .htmlLng(d => d.lng)
      .htmlAltitude(0.004)
      .htmlElement(d => {
        const wrap = document.createElement('div');
        wrap.className = 'cam-marker-wrap';

        // Tooltip al pasar el mouse
        const tooltip = document.createElement('div');
        tooltip.className = 'pin-tooltip';
        tooltip.innerHTML = `
          <b>🟢 ${d.city}</b> (${d.country})<br/>
          <span style="color:#00ff66;">${d.sector ? d.sector + ' • ' : ''}${d.desc}</span>
        `;
        wrap.appendChild(tooltip);

        // Pin circular plano
        const pin = document.createElement('div');
        pin.className = 'cam-pin';
        wrap.appendChild(pin);

        // Nombre de ciudad (1 sola vez por ciudad)
        if (d.showCityLabel) {
          const label = document.createElement('div');
          label.className = 'map-city-label';
          label.textContent = d.city;
          wrap.appendChild(label);
        }

        // Evento clic en el pin
        wrap.addEventListener('click', (e) => {
          e.stopPropagation();
          selectCamera(d);
        });

        return wrap;
      })

      // ONDAS RADAR PLANAS SUAVES EN CADA CIUDAD
      .ringsData(buildMarkerData(worldCams).filter(d => d.showCityLabel))
      .ringLat(d => d.lat)
      .ringLng(d => d.lng)
      .ringAltitude(0.003)
      .ringColor(() => (t) => `rgba(0, 255, 102, ${1 - t * 0.85})`)
      .ringMaxRadius(1.3)
      .ringPropagationSpeed(1.2)
      .ringRepeatPeriod(1400);

    // CARGAR CONTINENTES Y PAÍSES EN COLOR VERDE CLARO
    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(countries => {
        globe.polygonsData(countries.features)
          .polygonAltitude(0.002)
          .polygonCapColor(() => '#3b8c52')
          .polygonSideColor(() => '#286639')
          .polygonStrokeColor(() => '#1b4727')
          .polygonLabel(({ properties: d }) => {
            const nombrePais = traduccionPaises[d.ADMIN] || d.NAME_ES || d.ADMIN;
            return `
              <div class="custom-tooltip" style="padding: 0.25rem 0.5rem; font-size: 0.68rem;">
                <b>🌍 ${nombrePais}</b>
              </div>
            `;
          });
      });

    // GLOBO QUIETO POR DEFECTO EN CHILE
    globe.controls().autoRotate = false;
    globe.controls().autoRotateSpeed = 0.4;
    globe.pointOfView({ lat: -33.4489, lng: -70.6693, altitude: 2.1 }, 1500);

    // BOTÓN ACTIVAR/PAUSAR GIRO
    btnToggleRotate.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      globe.controls().autoRotate = isAutoRotating;
      btnToggleRotate.textContent = isAutoRotating ? '⏸ PAUSAR' : '▶ GIRO';
      btnToggleRotate.style.borderColor = isAutoRotating ? 'var(--accent)' : 'var(--border)';
    });

    function refreshGlobeData() {
      const markerData = buildMarkerData(worldCams);
      globe.htmlElementsData(markerData);
      globe.ringsData(markerData.filter(d => d.showCityLabel));
      renderDropdownCities();
    }

    function renderDropdownCities() {
      dropdownCities.innerHTML = '';
      worldCams.forEach(cam => {
        const item = document.createElement('button');
        item.className = 'dropdown-item';
        const label = cam.sector ? `${cam.city} (${cam.sector})` : cam.city;
        item.innerHTML = `<span>🟢 ${label}</span> <small style="color:var(--muted);">${cam.country}</small>`;
        item.addEventListener('click', () => {
          dropdownCities.classList.remove('open');
          selectCamera(cam);
        });
        dropdownCities.appendChild(item);
      });
    }

    btnToggleCities.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownCities.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownCities.contains(e.target) && e.target !== btnToggleCities) {
        dropdownCities.classList.remove('open');
      }
    });

    // Selecciona la cámara y verifica en vivo con la API oficial de YouTube (oEmbed) el nombre real del stream
    async function selectCamera(cam) {
      currentSelectedCam = cam;
      globe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 0.85 }, 1500);

      const sectorStr = cam.sector ? `[${cam.sector}] ` : '';
      streamTitle.textContent = `${cam.city} • ${sectorStr}${cam.desc}`;
      streamCoords.textContent = `${cam.lat.toFixed(2)}° Lat, ${cam.lng.toFixed(2)}° Lng • ${cam.country}`;
      streamIframe.src = `https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=1&mute=1&controls=1&rel=0`;
      btnYtDirect.href = `https://www.youtube.com/watch?v=${cam.id}`;

      if (isAdmin) {
        btnDeleteCam.style.display = 'inline-block';
      }

      playerDock.classList.add('active');

      // Verificación en tiempo real del título oficial del stream en YouTube
      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${cam.id}`);
        const info = await res.json();
        if (info && info.title && currentSelectedCam && currentSelectedCam.id === cam.id) {
          streamCoords.textContent = `📡 ${info.title.substring(0, 48)} (${cam.country})`;
        }
      } catch (e) {
        // Silencioso si falla la consulta de metadatos
      }
    }

    btnClose.addEventListener('click', () => {
      playerDock.classList.remove('active');
      streamIframe.src = '';
      currentSelectedCam = null;
      btnDeleteCam.style.display = 'none';
      globe.pointOfView({ altitude: 2.1 }, 1500);
    });

    // DRAG DE LA VENTANA FLOTANTE
    let isDragging = false;
    let dragStartX, dragStartY, initialLeft, initialTop;

    playerDragHeader.addEventListener('mousedown', (e) => {
      if (e.target.closest('.header-btns')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      const rect = playerDock.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      playerDock.style.bottom = 'auto';
      playerDock.style.right = 'auto';
      playerDock.style.left = `${initialLeft}px`;
      playerDock.style.top = `${initialTop}px`;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      newLeft = Math.max(10, Math.min(window.innerWidth - playerDock.offsetWidth - 10, newLeft));
      newTop = Math.max(10, Math.min(window.innerHeight - playerDock.offsetHeight - 10, newTop));

      playerDock.style.left = `${newLeft}px`;
      playerDock.style.top = `${newTop}px`;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.resizePlayer = function(widthPx) {
      playerDock.style.width = `${Math.min(widthPx, window.innerWidth - 40)}px`;
    };

    let isResizing = false;
    let resizeStartX, startWidth;

    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizeStartX = e.clientX;
      startWidth = playerDock.offsetWidth;
      e.preventDefault();
      e.stopPropagation();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const deltaX = e.clientX - resizeStartX;
      const newWidth = Math.max(280, Math.min(window.innerWidth * 0.9, startWidth + deltaX));
      playerDock.style.width = `${newWidth}px`;
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
    });

    // BUSCADOR INTELIGENTE DE PAÍS O CIUDAD
    async function searchAndFlyToLocation(rawQuery) {
      const q = norm(rawQuery);
      if (!q) return;

      // 1. Si escribió el nombre de un PAÍS que ya tenemos en nuestras cámaras (ej. "chile")
      const countryMatches = worldCams.filter(c => norm(c.country) === q);
      if (countryMatches.length > 0) {
        const avgLat = countryMatches.reduce((acc, c) => acc + c.lat, 0) / countryMatches.length;
        const avgLng = countryMatches.reduce((acc, c) => acc + c.lng, 0) / countryMatches.length;
        globe.pointOfView({ lat: avgLat, lng: avgLng, altitude: 1.75 }, 1800);
        return;
      }

      // 2. Coincidencia exacta con una CIUDAD o SECTOR de nuestras cámaras
      const exactCityOrSector = worldCams.find(c => norm(c.city) === q || norm(c.sector) === q);
      if (exactCityOrSector) {
        selectCamera(exactCityOrSector);
        return;
      }

      // 3. Coincidencia parcial en cámaras locales
      const partialMatch = worldCams.find(c =>
        norm(c.city).includes(q) ||
        norm(c.sector).includes(q) ||
        norm(c.desc).includes(q) ||
        norm(c.country).includes(q)
      );
      if (partialMatch) {
        if (norm(partialMatch.country).includes(q)) {
          const cMatches = worldCams.filter(c => norm(c.country) === norm(partialMatch.country));
          const avgLat = cMatches.reduce((acc, c) => acc + c.lat, 0) / cMatches.length;
          const avgLng = cMatches.reduce((acc, c) => acc + c.lng, 0) / cMatches.length;
          globe.pointOfView({ lat: avgLat, lng: avgLng, altitude: 1.75 }, 1800);
        } else {
          selectCamera(partialMatch);
        }
        return;
      }

      // 4. Búsqueda global en OpenStreetMap para cualquier otro país o ciudad
      btnSearchCity.textContent = '...';
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&accept-language=es&limit=1&q=${encodeURIComponent(rawQuery.trim())}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.length > 0) {
          const item = data[0];
          const lat = parseFloat(item.lat);
          const lng = parseFloat(item.lon);

          const isCountry = item.addresstype === 'country' || item.type === 'country' || item.type === 'administrative';
          const targetAltitude = isCountry ? 1.8 : 1.05;

          globe.pointOfView({ lat: lat, lng: lng, altitude: targetAltitude }, 1800);
        } else {
          alert('No encontramos ese país o ciudad en el mapa.');
        }
      } catch (err) {
        alert('Error al conectar con el buscador geográfico.');
      } finally {
        btnSearchCity.textContent = 'IR';
      }
    }

    btnSearchCity.addEventListener('click', () => searchAndFlyToLocation(inputCitySearch.value));
    inputCitySearch.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchAndFlyToLocation(inputCitySearch.value);
      }
    });

    function extractYouTubeID(url) {
      if (url.length === 11 && !url.includes('/') && !url.includes('.')) return url;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.trim().match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    btnAdmin.addEventListener('click', () => {
      if (isAdmin) {
        if (confirm('¿Cerrar sesión de administrador?')) {
          isAdmin = false;
          sessionStorage.removeItem('is_admin');
          actualizarVistaAdmin();
        }
      } else {
        const pass = prompt('Ingresa la contraseña de administrador:');
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          sessionStorage.setItem('is_admin', 'true');
          actualizarVistaAdmin();
        } else if (pass !== null) {
          alert('Contraseña incorrecta.');
        }
      }
    });

    function actualizarVistaAdmin() {
      if (isAdmin) {
        btnAdmin.textContent = '🔓 CERRAR';
        btnAdmin.classList.add('active');
        btnToggleAdd.style.display = 'inline-block';
        btnResetCam.style.display = 'inline-block';
        btnExportCam.style.display = 'inline-block';
        if (currentSelectedCam) btnDeleteCam.style.display = 'inline-block';
      } else {
        btnAdmin.textContent = '🔒 ADMIN';
        btnAdmin.classList.remove('active');
        btnToggleAdd.style.display = 'none';
        btnResetCam.style.display = 'none';
        btnExportCam.style.display = 'none';
        adminModal.classList.remove('open');
        btnDeleteCam.style.display = 'none';
      }
    }

    // Botón para restaurar la lista limpia si alguna vez se desordena el localStorage
    btnResetCam.addEventListener('click', () => {
      if (confirm('¿Restaurar la lista oficial verificada de cámaras y borrar cambios locales?')) {
        localStorage.removeItem(STORAGE_KEY);
        worldCams = [...worldCamsIniciales];
        refreshGlobeData();
        btnClose.click();
      }
    });

    btnExportCam.addEventListener('click', () => {
      const cleanCams = worldCams.map(({ id, city, sector, country, lat, lng, desc }) => ({
        id, city, sector, country, lat, lng, desc
      }));
      const codigoExport = `const worldCamsIniciales = ${JSON.stringify(cleanCams, null, 2)};`;
      navigator.clipboard.writeText(codigoExport).then(() => {
        alert('¡Copiado al portapapeles!\n\nAbre mundo.html en GitHub, busca la línea "const worldCamsIniciales" y reemplázala pegando lo que acabas de copiar.');
      });
    });

    btnToggleAdd.addEventListener('click', () => {
      adminModal.classList.toggle('open');
      if (adminModal.classList.contains('open')) {
        document.getElementById('worldCamUrl').focus();
      }
    });

    btnCloseModal.addEventListener('click', () => {
      adminModal.classList.remove('open');
    });

    formAddWorldCam.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawUrl = document.getElementById('worldCamUrl').value;
      const desc = document.getElementById('worldCamTitle').value.trim();
      const city = document.getElementById('worldCamCity').value.trim();
      const country = document.getElementById('worldCamCountry').value.trim();

      const videoId = extractYouTubeID(rawUrl);
      if (!videoId) return alert('Enlace de YouTube no válido.');

      btnSubmitCam.disabled = true;
      btnSubmitCam.textContent = 'VERIFICANDO Y LOCALIZANDO...';

      try {
        // 1. Verificar que el video exista en YouTube antes de clavarlo
        const ytCheck = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
        const ytData = await ytCheck.json();
        if (ytData.error) {
          alert('Ese video de YouTube no existe o es privado.');
          return;
        }

        // 2. Geolocalizar exactamente el sector + ciudad + país
        const geoQuery = `${desc}, ${city}, ${country}`;
        let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=es&limit=1&q=${encodeURIComponent(geoQuery)}`);
        let data = await res.json();

        // Si no encuentra el sector específico, busca por ciudad + país
        if (!data || data.length === 0) {
          res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=es&limit=1&q=${encodeURIComponent(`${city},${country}`)}`);
          data = await res.json();
        }

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);

          const newCam = { id: videoId, city, sector: desc, country, lat, lng, desc: ytData.title || desc };
          worldCams.unshift(newCam);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(worldCams));

          refreshGlobeData();
          formAddWorldCam.reset();
          adminModal.classList.remove('open');
          selectCamera(newCam);
        } else {
          alert('No pudimos geolocalizar esa ciudad.');
        }
      } catch (err) {
        alert('Error al contactar el mapa.');
      } finally {
        btnSubmitCam.disabled = false;
        btnSubmitCam.textContent = 'VERIFICAR Y CLAVAR';
      }
    });

    btnDeleteCam.addEventListener('click', () => {
      if (!isAdmin || !currentSelectedCam) return;
      if (confirm(`¿Eliminar la cámara "${currentSelectedCam.city} - ${currentSelectedCam.desc}"?`)) {
        worldCams = worldCams.filter(c => c.id !== currentSelectedCam.id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(worldCams));
        refreshGlobeData();
        btnClose.click();
      }
    });

    window.addEventListener('resize', () => {
      globe.width(window.innerWidth).height(window.innerHeight);
    });

    refreshGlobeData();
    actualizarVistaAdmin();
  </script>
</body>
</html>
