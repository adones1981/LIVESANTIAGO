<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarthCam Garden | Explorador Global</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <!-- Motor Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg: #020617;
      --accent: #00f2fe;
      --live-red: #ff334b;
      --card-bg: rgba(10, 17, 33, 0.95);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      z-index: 30;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
      max-width: calc(100vw - 3rem);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--accent);
      color: #07090e;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .brand-title h1 span {
      color: var(--accent);
    }

    .brand-title p {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .search-city-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      gap: 0.4rem;
    }

    .search-city-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.8rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 150px;
    }

    .search-city-box input::placeholder {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .btn-search {
      background: var(--accent);
      color: #07090e;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-control:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 280px;
      max-height: 50vh;
      overflow-y: auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 50;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent);
    }

    /* ADMIN */
    .btn-admin {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;

    }

    .btn-add-cam, .btn-export-cam {

      color: var(--accent);
      padding: 0.45rem 0.85rem;

      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;

      transition: all 0.2s ease;

    .btn-add-cam:hover {

      color: #07090e;

    .btn-export-cam {

      background: rgba(168, 85, 247, 0.15);
    }

    .btn-export-cam:hover {
      background: #a855f7;
      color: #fff;
    }

    .admin-modal {
      display: none;

      top: 5.5rem;
      left: 1.5rem;
      z-index: 35;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 1.25rem;
      width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.15);
      backdrop-filter: blur(20px);
    }

    .admin-modal.open {
      display: block;
    }

    .admin-modal h3 {
      font-size: 0.88rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-modal form {

      flex-direction: column;
      gap: 0.65rem;
    }

    .modal-input {

      padding: 0.55rem 0.75rem;
      color: #fff;
      font-size: 0.8rem;

    .modal-input:focus {

    }

    .btn-submit-cam {

      color: #07090e;
      border: none;
      border-radius: 6px;
      padding: 0.6rem;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.4rem;
    }

    .hint-overlay {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.5px;

    /* REPRODUCTOR */
    .player-dock {
      position: fixed;
      bottom: 2rem;
      left: 2rem;

      min-width: 280px;

      border-radius: 14px;
      z-index: 40;

      display: none;
      flex-direction: column;
      touch-action: none;
      overflow: visible;
    }

    .player-dock.active {
      display: flex;
    }

    .player-header {
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(0, 0, 0, 0.4);

      gap: 0.5rem;

      cursor: grabbing;

    .location-info {
      overflow: hidden;
      pointer-events: none;

      font-size: 0.88rem;
      color: #fff;
      font-weight: 700;

      overflow: hidden;
      text-overflow: ellipsis;

      color: var(--accent);

      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;

      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;

    .size-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .btn-yt-direct {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 4px;

      font-size: 0.68rem;

      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;

      display: inline-flex;
      align-items: center;

      color: #07090e;
    }

      color: var(--live-red);
      font-size: 0.68rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-family: 'JetBrains Mono', monospace;

    .btn-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.2rem;
    }

    .btn-close:hover {
      color: #fff;
    }

    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      overflow: hidden;
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .resize-handle {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 10px;
      font-weight: bold;
      opacity: 0.6;
    }

    .custom-tooltip {
      background: rgba(10, 17, 33, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }
  </style>
</head>

  <script>

    // 1. CÁMARAS CON SUS COORDENADAS EXACTAS

      { id: "xoyKM6BQceM", city: "Tokio", sector: "Shibuya", country: "Japón", lat: 35.6595, lng: 139.7004, desc: "Cruce Shibuya Live" },
      { id: "wyEi0OPai5g", city: "Seúl", sector: "Centro", country: "Corea del Sur", lat: 37.5665, lng: 126.9780, desc: "Panorama Urbano Metropolitano" },

      { id: "7dc4Y_Vb_Wc", city: "Río de Janeiro", sector: "Copacabana", country: "Brasil", lat: -22.9711, lng: -43.1822, desc: "Playa Copacabana" }
    ];

    // CIUDADES IMPORTANTES DEL MUNDO
    const worldCitiesRef = [
      { name: "Madrid", country: "España", lat: 40.4168, lng: -3.7038 },
      { name: "París", country: "Francia", lat: 48.8566, lng: 2.3522 },

      { name: "Buenos Aires", country: "Argentina", lat: -34.6037, lng: -58.3816 },
      { name: "Lima", country: "Perú", lat: -12.0464, lng: -77.0428 },
      { name: "Bogotá", country: "Colombia", lat: 4.7110, lng: -74.0721 },
      { name: "Ciudad de México", country: "México", lat: 19.4326, lng: -99.1332 }
    ];

    let worldCams = JSON.parse(localStorage.getItem('earthcam_garden_cams')) || worldCamsIniciales;
    let isAdmin = sessionStorage.getItem('is_admin') === 'true';
    let currentSelectedCam = null;
    let isAutoRotating = false;
    let currentAltitude = 2.2;

    const playerDock = document.getElementById('playerDock');
    const playerDragHeader = document.getElementById('playerDragHeader');
    const resizeHandle = document.getElementById('resizeHandle');
    const streamTitle = document.getElementById('streamTitle');
    const streamCoords = document.getElementById('streamCoords');
    const streamIframe = document.getElementById('streamIframe');
    const btnYtDirect = document.getElementById('btnYtDirect');
    const btnClose = document.getElementById('btnClose');

    const btnToggleCities = document.getElementById('btnToggleCities');
    const dropdownCities = document.getElementById('dropdownCities');
    const btnToggleRotate = document.getElementById('btnToggleRotate');

    const inputCitySearch = document.getElementById('inputCitySearch');
    const btnSearchCity = document.getElementById('btnSearchCity');

    const btnAdmin = document.getElementById('btnAdmin');
    const btnToggleAdd = document.getElementById('btnToggleAdd');
    const btnExportCam = document.getElementById('btnExportCam');
    const adminModal = document.getElementById('adminModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const formAddWorldCam = document.getElementById('formAddWorldCam');
    const btnSubmitCam = document.getElementById('btnSubmitCam');
    const btnDeleteCam = document.getElementById('btnDeleteCam');

    // ==========================================================
    // SISTEMA DE AGRUPACIÓN INTELIGENTE (CLUSTERING POR ZOOM)
    // ==========================================================
    function getDisplayPoints(altitude) {
      const isZoomedIn = altitude < 1.4; // Si nos acercamos, se separan
      const points = [];

      // 1. Procesar Cámaras
      const cityGroups = {};
      worldCams.forEach(cam => {
        const key = `${cam.city}-${cam.country}`;
        if (!cityGroups[key]) cityGroups[key] = [];
        cityGroups[key].push(cam);
      });

      Object.values(cityGroups).forEach(group => {
        if (!isZoomedIn && group.length > 1) {
          // VISTA LEJANA: Agrupadas con el número de cámaras
          const avgLat = group.reduce((s, c) => s + c.lat, 0) / group.length;
          const avgLng = group.reduce((s, c) => s + c.lng, 0) / group.length;
          points.push({
            lat: avgLat,
            lng: avgLng,
            text: `${group[0].city} (${group.length})`,
            subtext: `${group[0].country} • ${group.length} cámaras`,
            isCluster: true,
            cams: group,
            size: 0.9,
            color: '#00f2fe'
          });
        } else {
          // VISTA CERCANA (O CIUDAD CON 1 SOLA CÁMARA): Se separan individualmente
          group.forEach(cam => {
            points.push({
              lat: cam.lat,
              lng: cam.lng,
              text: cam.sector ? `${cam.city} - ${cam.sector}` : cam.city,
              subtext: `${cam.country} • ${cam.desc}`,
              isCluster: false,
              camData: cam,
              size: 0.75,
              color: '#00f2fe'
            });
          });
        }
      });

      // 2. Ciudades del mundo (solo se muestran cuando no coinciden con cámaras)
      worldCitiesRef.forEach(ci => {
        const hasCam = worldCams.some(c => c.city.toLowerCase() === ci.name.toLowerCase());
        if (!hasCam) {
          points.push({
            lat: ci.lat,
            lng: ci.lng,
            text: ci.name,
            subtext: ci.country,
            isReferenceCity: true,
            size: 0.65,
            color: 'rgba(255, 255, 255, 0.65)'
          });
        }
      });

      return points;
    }

    // INICIALIZACIÓN GLOBO (QUIETO, NATIVO Y LIMPIO)
    const globe = Globe()
      (document.getElementById('globeViz'))
      .backgroundColor('#020617')
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .atmosphereColor('#00f2fe')
      .atmosphereAltitude(0.18)

      // ETIQUETAS PLANAS SIN LETRAS ROTAS
      .labelsData(getDisplayPoints(2.2))
      .labelLat(d => d.lat)
      .labelLng(d => d.lng)
      .labelText(d => d.text)
      .labelSize(d => d.size)
      .labelDotRadius(0.35)
      .labelColor(d => d.color)
      .labelResolution(2)
      .labelAltitude(0.01)
      .onLabelClick(d => {
        if (d.isCluster) {
          // Si hace clic en un grupo, hace zoom hacia allá y las separa
          globe.pointOfView({ lat: d.lat, lng: d.lng, altitude: 0.9 }, 1200);
        } else if (d.camData) {
          // Si es cámara individual, la abre
          selectCamera(d.camData);
        } else {
          // Ciudad de referencia sin cámara
          globe.pointOfView({ lat: d.lat, lng: d.lng, altitude: 1.1 }, 1200);
        }
      })

      // ONDAS RADAR SUAVES
      .ringsData(worldCams)
      .ringLat(d => d.lat)
      .ringLng(d => d.lng)
      .ringColor(() => (t) => `rgba(0, 242, 254, ${1 - t})`)
      .ringMaxRadius(2.2)
      .ringPropagationSpeed(1.8)
      .ringRepeatPeriod(1000);

    // GLOBO ESTÁTICO (NO SE MUEVE SOLO)
    globe.controls().autoRotate = false;
    globe.controls().autoRotateSpeed = 0.4;
    globe.pointOfView({ lat: -33.4489, lng: -70.6693, altitude: 2.2 }, 1500);

    // ESCUCHAR EL ZOOM PARA SEPARAR O AGRUPAR AUTOMÁTICAMENTE
    globe.controls().addEventListener('change', () => {
      const pov = globe.pointOfView();
      if (Math.abs(pov.altitude - currentAltitude) > 0.25) {
        currentAltitude = pov.altitude;
        globe.labelsData(getDisplayPoints(currentAltitude));
      }
    });

    // BOTÓN GIRO MANUAL
    btnToggleRotate.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      globe.controls().autoRotate = isAutoRotating;
      btnToggleRotate.textContent = isAutoRotating ? '⏸ PAUSAR' : '▶ GIRO';
      btnToggleRotate.style.borderColor = isAutoRotating ? 'var(--accent)' : 'var(--border)';
    });

    // CARGAR POLÍGONOS DE PAÍSES
    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(countries => {
        globe.polygonsData(countries.features)
          .polygonCapColor(() => 'rgba(255, 255, 255, 0.0)')
          .polygonSideColor(() => 'rgba(0, 0, 0, 0)')
          .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.25)')
          .polygonLabel(({ properties: d }) => `
            <div class="custom-tooltip">
              <b>🌍 ${d.ADMIN}</b>
            </div>
          `);
      })
      .catch(() => {});

    function refreshGlobeData() {
      globe.labelsData(getDisplayPoints(currentAltitude));
      globe.ringsData(worldCams);
      renderDropdownCities();
    }

    function renderDropdownCities() {
      dropdownCities.innerHTML = '';
      worldCams.forEach(cam => {
        const item = document.createElement('button');
        item.className = 'dropdown-item';
        const label = cam.sector ? `${cam.city} (${cam.sector})` : cam.city;
        item.innerHTML = `<span>📹 ${label}</span> <small style="color:var(--muted);">${cam.country}</small>`;
        item.addEventListener('click', () => {
          dropdownCities.classList.remove('open');
          selectCamera(cam);
        });
        dropdownCities.appendChild(item);
      });
    }

    btnToggleCities.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownCities.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownCities.contains(e.target) && e.target !== btnToggleCities) {
        dropdownCities.classList.remove('open');
      }
    });

    function selectCamera(cam) {
      currentSelectedCam = cam;
      globe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 0.9 }, 1500);

      const sectorStr = cam.sector ? `[${cam.sector}] ` : '';
      streamTitle.textContent = `${cam.city} - ${sectorStr}${cam.desc}`;
      streamCoords.textContent = `${cam.lat.toFixed(2)}° Lat, ${cam.lng.toFixed(2)}° Lng • ${cam.country}`;
      streamIframe.src = `https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=1&mute=1&controls=1&rel=0`;
      btnYtDirect.href = `https://www.youtube.com/watch?v=${cam.id}`;

      if (isAdmin) {
        btnDeleteCam.style.display = 'inline-block';
      }

      playerDock.classList.add('active');
    }

    btnClose.addEventListener('click', () => {
      playerDock.classList.remove('active');
      streamIframe.src = '';
      currentSelectedCam = null;
      btnDeleteCam.style.display = 'none';
      globe.pointOfView({ altitude: 2.2 }, 1500);
    });

    // DRAG DE LA VENTANA
    let isDragging = false;
    let dragStartX, dragStartY, initialLeft, initialTop;

    playerDragHeader.addEventListener('mousedown', (e) => {
      if (e.target.closest('.header-btns')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      const rect = playerDock.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      playerDock.style.bottom = 'auto';
      playerDock.style.right = 'auto';
      playerDock.style.left = `${initialLeft}px`;
      playerDock.style.top = `${initialTop}px`;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      newLeft = Math.max(10, Math.min(window.innerWidth - playerDock.offsetWidth - 10, newLeft));
      newTop = Math.max(10, Math.min(window.innerHeight - playerDock.offsetHeight - 10, newTop));

      playerDock.style.left = `${newLeft}px`;
      playerDock.style.top = `${newTop}px`;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.resizePlayer = function(widthPx) {
      playerDock.style.width = `${Math.min(widthPx, window.innerWidth - 40)}px`;
    };

    let isResizing = false;
    let resizeStartX, startWidth;

    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizeStartX = e.clientX;
      startWidth = playerDock.offsetWidth;
      e.preventDefault();
      e.stopPropagation();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const deltaX = e.clientX - resizeStartX;
      const newWidth = Math.max(280, Math.min(window.innerWidth * 0.9, startWidth + deltaX));
      playerDock.style.width = `${newWidth}px`;
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
    });

    // BUSCADOR GEO
    async function searchAndFlyToCity(cityName) {
      if (!cityName.trim()) return;

      const camExist = worldCams.find(c => c.city.toLowerCase().includes(cityName.toLowerCase()));
      if (camExist) {
        selectCamera(camExist);
        return;
      }

      btnSearchCity.textContent = '...';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityName)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          globe.pointOfView({ lat: lat, lng: lng, altitude: 1.1 }, 2000);
        } else {
          alert('No encontramos esa ciudad en el mapa.');
        }
      } catch (err) {
        alert('Error al localizar la ciudad.');
      } finally {
        btnSearchCity.textContent = 'IR';
      }
    }

    btnSearchCity.addEventListener('click', () => searchAndFlyToCity(inputCitySearch.value));
    inputCitySearch.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchAndFlyToCity(inputCitySearch.value);
    });

    function extractYouTubeID(url) {
      if (url.length === 11 && !url.includes('/') && !url.includes('.')) return url;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.trim().match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    btnAdmin.addEventListener('click', () => {
      if (isAdmin) {
        if (confirm('¿Cerrar sesión de administrador?')) {
          isAdmin = false;
          sessionStorage.removeItem('is_admin');
          actualizarVistaAdmin();
        }
      } else {
        const pass = prompt('Ingresa la contraseña de administrador:');
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          sessionStorage.setItem('is_admin', 'true');
          actualizarVistaAdmin();
        } else if (pass !== null) {
          alert('Contraseña incorrecta.');
        }
      }
    });

    function actualizarVistaAdmin() {
      if (isAdmin) {
        btnAdmin.textContent = '🔓 CERRAR';
        btnAdmin.classList.add('active');
        btnToggleAdd.style.display = 'inline-block';
        btnExportCam.style.display = 'inline-block';
        if (currentSelectedCam) btnDeleteCam.style.display = 'inline-block';
      } else {
        btnAdmin.textContent = '🔒 ADMIN';
        btnAdmin.classList.remove('active');
        btnToggleAdd.style.display = 'none';
        btnExportCam.style.display = 'none';
        adminModal.classList.remove('open');
        btnDeleteCam.style.display = 'none';
      }
    }

    btnExportCam.addEventListener('click', () => {
      const codigoExport = `const worldCamsIniciales = ${JSON.stringify(worldCams, null, 2)};`;
      navigator.clipboard.writeText(codigoExport).then(() => {
        alert('¡Copiado al portapapeles!\n\nAbre mundo.html en GitHub, busca la línea "const worldCamsIniciales" y reemplázala pegando lo que acabas de copiar.');
      });
    });

    btnToggleAdd.addEventListener('click', () => {
      adminModal.classList.toggle('open');
      if (adminModal.classList.contains('open')) {
        document.getElementById('worldCamUrl').focus();
      }
    });

    btnCloseModal.addEventListener('click', () => {
      adminModal.classList.remove('open');
    });

    formAddWorldCam.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawUrl = document.getElementById('worldCamUrl').value;
      const desc = document.getElementById('worldCamTitle').value.trim();
      const city = document.getElementById('worldCamCity').value.trim();
      const country = document.getElementById('worldCamCountry').value.trim();

      const videoId = extractYouTubeID(rawUrl);
      if (!videoId) return alert('Enlace de YouTube no válido.');

      btnSubmitCam.disabled = true;
      btnSubmitCam.textContent = 'LOCALIZANDO EN EL PLANETA...';

      try {
        const geoQuery = `${city}, ${country}`;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(geoQuery)}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);

          const newCam = { id: videoId, city, sector: desc, country, lat, lng, desc };
          worldCams.unshift(newCam);
          localStorage.setItem('earthcam_garden_cams', JSON.stringify(worldCams));

          refreshGlobeData();
          formAddWorldCam.reset();
          adminModal.classList.remove('open');
          selectCamera(newCam);
        } else {
          alert('No pudimos geolocalizar esa ciudad.');
        }
      } catch (err) {
        alert('Error al contactar el mapa.');
      } finally {
        btnSubmitCam.disabled = false;
        btnSubmitCam.textContent = 'GEOLOCALIZAR Y CLAVAR';
      }
    });

    btnDeleteCam.addEventListener('click', () => {
      if (!isAdmin || !currentSelectedCam) return;
      if (confirm(`¿Eliminar la cámara "${currentSelectedCam.city} - ${currentSelectedCam.desc}"?`)) {
        worldCams = worldCams.filter(c => c !== currentSelectedCam);
        localStorage.setItem('earthcam_garden_cams', JSON.stringify(worldCams));
        refreshGlobeData();
        btnClose.click();
      }
    });

    window.addEventListener('resize', () => {
      globe.width(window.innerWidth).height(window.innerHeight);
    });

    refreshGlobeData();
    actualizarVistaAdmin();
  </script>
</body>
</html>
