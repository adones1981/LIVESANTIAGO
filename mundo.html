}

      const elem = document.getElementById('globeViz');
      worldGlobe = Globe()(elem)
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .pointsData(camarasMundo)
        .pointLat('lat')
        .pointLng('lng')
        .pointColor(() => '#00ff66')
        .pointAltitude(0.01)
        .pointRadius(0.85)
        .pointLabel(d => `<div style="background:#0a1121;border:1px solid #00ff66;padding:4px 8px;border-radius:4px;color:#fff;font-family:monospace;font-size:11px;">🟢 ${d.city} - ${d.sector} (${d.country})</div>`)
        .onPointClick(point => {
          seleccionarCamara(point);
        });

      worldGlobe.pointOfView({ lat: 15, lng: -50, altitude: 2.2 });
      worldGlobe.controls().autoRotate = true;
      worldGlobe.controls().autoRotateSpeed = 0.35;
    }

    /* RENDER DE ENLACES EN EL PANEL IZQUIERDO */
    const linksContainer = document.getElementById('worldLinksList');
    function renderLinks() {
      linksContainer.innerHTML = '';
      document.getElementById('camsCount').textContent = `${camarasMundo.length} CAMS`;
      camarasMundo.forEach(cam => {
        const link = document.createElement('div');
        link.className = 'world-cam-link';
        link.id = `link_${cam.id}`;
        link.innerHTML = `
          <span class="link-city-title">📍 ${cam.city} - ${cam.sector}</span>
          <span class="link-country-badge">${cam.country}</span>
        `;
        link.addEventListener('click', () => {
          seleccionarCamara(cam);
        });
        linksContainer.appendChild(link);
      });
    }

    /* SELECCIONAR CÁMARA */
    const playerBox = document.getElementById('modalPlayerFloat');
    const playerTitle = document.getElementById('playerCamTitle');
    const playerIframe = document.getElementById('playerIframe');

    function seleccionarCamara(cam) {
      document.querySelectorAll('.world-cam-link').forEach(l => l.classList.remove('active'));
      const activeLink = document.getElementById(`link_${cam.id}`);
      if (activeLink) {
        activeLink.classList.add('active');
        activeLink.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      if (worldGlobe) {
        worldGlobe.controls().autoRotate = false;
        worldGlobe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 1.4 }, 1200);
      }

      playerTitle.textContent = `${cam.city.toUpperCase()} - ${cam.sector.toUpperCase()} (${cam.country})`;
      playerIframe.src = `https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=1&mute=1&rel=0`;
      playerBox.style.display = 'block';
    }

    function cerrarReproductor() {
      playerBox.style.display = 'none';
      playerIframe.src = '';
      document.querySelectorAll('.world-cam-link').forEach(l => l.classList.remove('active'));
      if (worldGlobe) worldGlobe.controls().autoRotate = true;
    }

    /* LÓGICA DRAG & DROP PARA LA VENTANA FLOTANTE */
    (function makeDraggable() {
      const floatBox = document.getElementById('modalPlayerFloat');
      const headerBar = document.getElementById('modalPlayerBar');
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      headerBar.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('btn-close-player')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = floatBox.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });

      function onMouseMove(e) {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        let newX = initialLeft + dx;
        let newY = initialTop + dy;

        // Limitar dentro del viewport
        newX = Math.max(10, Math.min(newX, window.innerWidth - floatBox.offsetWidth - 10));
        newY = Math.max(70, Math.min(newY, window.innerHeight - floatBox.offsetHeight - 10));

        floatBox.style.left = `${newX}px`;
        floatBox.style.top = `${newY}px`;
      }

      function onMouseUp() {
        isDragging = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }

      // Soporte Touch para móviles
      headerBar.addEventListener('touchstart', (e) => {
        if (e.target.classList.contains('btn-close-player')) return;
        isDragging = true;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        const rect = floatBox.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
      });

      headerBar.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;

        let newX = initialLeft + dx;
        let newY = initialTop + dy;

        newX = Math.max(10, Math.min(newX, window.innerWidth - floatBox.offsetWidth - 10));
        newY = Math.max(70, Math.min(newY, window.innerHeight - floatBox.offsetHeight - 10));

        floatBox.style.left = `${newX}px`;
        floatBox.style.top = `${newY}px`;
      });

      headerBar.addEventListener('touchend', () => { isDragging = false; });
    })();

    /* CLIMA MUNDIAL DERECHO */
    const weatherContainer = document.getElementById('worldWeatherList');

    async function cargarClimaCiudadMundo(item, contenedor, prepend = false) {
      const card = document.createElement('div');
      card.className = 'weather-city-card';
      card.innerHTML = `
        <div>
          <span class="weather-city-name">${item.nombre}</span>
          <span class="weather-city-country">${item.pais}</span>
        </div>
        <div class="weather-city-temp" id="temp_${item.nombre.replace(/\s+/g, '')}">
          <span>--°C</span>
        </div>
      `;

      if (prepend) {
        contenedor.insertBefore(card, contenedor.firstChild);
      } else {
        contenedor.appendChild(card);
      }

      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${item.lat}&longitude=${item.lng}&current=temperature_2m,weather_code&timezone=auto`);
        const data = await res.json();
        const cur = data.current;
        const cond = traducirWMO(cur.weather_code);
        const tempEl = document.getElementById(`temp_${item.nombre.replace(/\s+/g, '')}`);
        if (tempEl) {
          tempEl.innerHTML = `<span>${Math.round(cur.temperature_2m)}°C</span> <span>${cond.icono}</span>`;
          tempEl.title = cond.texto;
        }
      } catch (e) {
        const tempEl = document.getElementById(`temp_${item.nombre.replace(/\s+/g, '')}`);
        if (tempEl) tempEl.innerHTML = `<span>--</span>`;
      }
    }

    function renderWeatherSidebar() {
      weatherContainer.innerHTML = '';
      ciudadesClimaMundo.forEach(ciudad => {
        cargarClimaCiudadMundo(ciudad, weatherContainer);
      });
    }

    async function buscarClimaMundo() {
      const input = document.getElementById('worldWeatherInput');
      const q = input.value.trim();
      if (!q) return;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          const nombreParts = data[0].display_name.split(',');
          const ciudadNombre = nombreParts[0];
          const paisNombre = nombreParts[nombreParts.length - 1].trim();

          cargarClimaCiudadMundo({ nombre: ciudadNombre, pais: paisNombre, lat, lng }, weatherContainer, true);
          input.value = '';

          if (worldGlobe) {
            worldGlobe.controls().autoRotate = false;
            worldGlobe.pointOfView({ lat, lng, altitude: 1.5 }, 1200);
          }
        } else {
          alert("No se encontró esa ciudad en el mundo.");
        }
      } catch (e) {
        alert("Error al consultar el clima satelital.");
      }
    }

    document.getElementById('worldWeatherInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') buscarClimaMundo();
    });

    /* RADIO DELOREAN */
    let radioAudioPlayer = null;
    let currentStationId = localStorage.getItem('radio_delorean_station') || 'BuB9SaS2cWE';
    let savedVol = parseInt(localStorage.getItem('radio_delorean_vol') || '50', 10);
    let shouldAutoPlay = localStorage.getItem('radio_delorean_playing') === 'true';

    (function initRadioApi() {
      const ytScript = document.createElement('script');
      ytScript.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(ytScript);
    })();

    window.onYouTubeIframeAPIReady = function() {
      radioAudioPlayer = new YT.Player('radioHiddenPlayer', {
        height: '1', width: '1', videoId: currentStationId,
        playerVars: { autoplay: shouldAutoPlay ? 1 : 0, controls: 0 },
        events: { 
          'onReady': () => {
            radioAudioPlayer.setVolume(savedVol);
            document.getElementById('miniRadioVol').value = savedVol;
            if (shouldAutoPlay) {
              radioAudioPlayer.playVideo();
              document.getElementById('btnMiniRadioPlay').textContent = '⏸';
            }
            actualizarBotonEstacion(currentStationId);
          } 
        }
      });
    };

    function toggleMiniRadio() {
      if (!radioAudioPlayer || typeof radioAudioPlayer.getPlayerState !== 'function') return;
      const btn = document.getElementById('btnMiniRadioPlay');
      if (radioAudioPlayer.getPlayerState() === 1) {
        radioAudioPlayer.pauseVideo();
        btn.textContent = '▶';
        localStorage.setItem('radio_delorean_playing', 'false');
      } else {
        radioAudioPlayer.playVideo();
        btn.textContent = '⏸';
        localStorage.setItem('radio_delorean_playing', 'true');
      }
    }

    function switchMiniStation(videoId, btnEl) {
      currentStationId = videoId;
      localStorage.setItem('radio_delorean_station', videoId);
      const btnPlay = document.getElementById('btnMiniRadioPlay');

      if (radioAudioPlayer && typeof radioAudioPlayer.loadVideoById === 'function') {
        radioAudioPlayer.loadVideoById(videoId);
        btnPlay.textContent = '⏸';
        localStorage.setItem('radio_delorean_playing', 'true');
      }
      actualizarBotonEstacion(videoId);
    }

    function actualizarBotonEstacion(videoId) {
      document.querySelectorAll('.btn-mini-station').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn_st_' + videoId);
      if (activeBtn) activeBtn.classList.add('active');
    }

    document.getElementById('miniRadioVol').addEventListener('input', (e) => {
      const vol = e.target.value;
      localStorage.setItem('radio_delorean_vol', vol);
      if (radioAudioPlayer && typeof radioAudioPlayer.setVolume === 'function') {
        radioAudioPlayer.setVolume(vol);
      }
    });

    window.addEventListener('resize', () => {
      if (worldGlobe) worldGlobe.width(window.innerWidth).height(window.innerHeight);
    });

    document.addEventListener('DOMContentLoaded', () => {
      initGlobe();
      renderLinks();
      renderWeatherSidebar();
    });
  </script>
</body>
</html>
