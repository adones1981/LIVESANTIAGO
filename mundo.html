<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarthCam Garden | Explorador Global</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <!-- Motor Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg: #020813;
      --accent: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.45);
      --live-red: #ff334b;
      --card-bg: rgba(10, 17, 33, 0.95);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #globeViz:active {
      cursor: grabbing;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      z-index: 30;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
      max-width: calc(100vw - 3rem);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--accent);
      color: #07090e;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .brand-title h1 span {
      color: var(--accent);
    }

    .brand-title p {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .search-city-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.2rem 0.6rem;
      gap: 0.4rem;
    }

    .search-city-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.8rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 150px;
    }

    .search-city-box input::placeholder {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .btn-search {
      background: var(--accent);
      color: #07090e;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-control:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 280px;
      max-height: 50vh;
      overflow-y: auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 50;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(0, 255, 102, 0.15);
      color: var(--accent);
    }

    /* ADMIN */
    .btn-admin {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;
    }

    .btn-admin.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-add-cam, .btn-export-cam {
      background: rgba(0, 255, 102, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      display: none;
      transition: all 0.2s ease;
    }

    .btn-add-cam:hover {
      background: var(--accent);
      color: #07090e;
    }

    .btn-export-cam {
      border-color: #a855f7;
      color: #d8b4fe;
      background: rgba(168, 85, 247, 0.15);
    }

    .btn-export-cam:hover {
      background: #a855f7;
      color: #fff;
    }

    /* MODAL ADMIN */
    .admin-modal {
      display: none;
      position: absolute;
      top: 5.5rem;
      left: 1.5rem;
      z-index: 35;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 1.25rem;
      width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 102, 0.15);
      backdrop-filter: blur(20px);
    }

    .admin-modal.open {
      display: block;
    }

    .admin-modal h3 {
      font-size: 0.88rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-modal form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .modal-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      width: 100%;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .btn-submit-cam {
      background: var(--accent);
      color: #07090e;
      border: none;
      border-radius: 6px;
      padding: 0.6rem;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.4rem;
    }

    .hint-overlay {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    /* REPRODUCTOR FLOTANTE */
    .player-dock {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      width: 440px;
      min-width: 280px;
      max-width: 90vw;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 14px;
      z-index: 40;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 255, 102, 0.15);
      display: none;
      flex-direction: column;
      touch-action: none;
      overflow: visible;
    }

    .player-dock.active {
      display: flex;
    }

    .player-header {
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.4);
      cursor: grab;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      gap: 0.5rem;
    }

    .player-header:active {
      cursor: grabbing;
    }

    .location-info {
      overflow: hidden;
      pointer-events: none;
    }

    .location-info h2 {
      font-size: 0.88rem;
      color: #fff;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-info p {
      font-size: 0.68rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .size-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .size-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .btn-yt-direct {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-yt-direct:hover {
      background: var(--accent);
      color: #07090e;
    }

    .btn-del-cam {
      background: rgba(255, 51, 75, 0.15);
      border: 1px solid var(--live-red);
      color: var(--live-red);
      font-size: 0.68rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.2rem;
    }

    .btn-close:hover {
      color: #fff;
    }

    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      overflow: hidden;
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .resize-handle {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 10px;
      font-weight: bold;
      opacity: 0.6;
    }

    .custom-tooltip {
      background: rgba(10, 17, 33, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      pointer-events: none;
      box-shadow: 0 0 15px var(--accent-glow);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-back">← CHILE</a>
    <div class="brand-title">
      <h1>EARTH<span>CAM</span></h1>
      <p>EXPLORADOR MUNDIAL</p>
    </div>

    <div class="dropdown-container">
      <button class="btn-control" id="btnToggleCities">📋 CÁMARAS EN VIVO ▼</button>
      <div class="dropdown-menu" id="dropdownCities"></div>
    </div>

    <button class="btn-control" id="btnToggleRotate">▶ GIRO</button>

    <div class="search-city-box">
      <input type="text" id="inputCitySearch" placeholder="Buscar país o ciudad...">
      <button class="btn-search" id="btnSearchCity">IR</button>
    </div>

    <button class="btn-admin" id="btnAdmin">🔒 ADMIN</button>
    <button class="btn-add-cam" id="btnToggleAdd">+ AÑADIR CÁMARA</button>
    <button class="btn-export-cam" id="btnExportCam" title="Copiar lista para GitHub">📋 COPIAR PARA GITHUB</button>
  </header>

  <div class="admin-modal" id="adminModal">
    <h3>
      <span>+ NUEVA CÁMARA AL GLOBO</span>
      <span style="cursor:pointer;" id="btnCloseModal">&times;</span>
    </h3>
    <form id="formAddWorldCam">
      <input type="text" id="worldCamUrl" class="modal-input" placeholder="Enlace de YouTube..." required>
      <input type="text" id="worldCamTitle" class="modal-input" placeholder="Nombre o sector (ej. Centro)" required>
      <input type="text" id="worldCamCity" class="modal-input" placeholder="Ciudad (ej. Roma)" required>
      <input type="text" id="worldCamCountry" class="modal-input" placeholder="País (ej. Italia)" required>
      <button type="submit" class="btn-submit-cam" id="btnSubmitCam">GEOLOCALIZAR Y CLAVAR</button>
    </form>
  </div>

  <div class="hint-overlay">Haz clic en los puntos verdes para abrir la transmisión</div>

  <div id="globeViz"></div>

  <div class="player-dock" id="playerDock">
    <div class="player-header" id="playerDragHeader">
      <div class="location-info">
        <h2 id="streamTitle">Selecciona una ciudad</h2>
        <p id="streamCoords">--° N, --° E</p>
      </div>
      <div class="header-btns">
        <a id="btnYtDirect" class="btn-yt-direct" href="#" target="_blank" title="Abrir en YouTube">↗ YT</a>
        <button class="size-btn" onclick="resizePlayer(320)">S</button>
        <button class="size-btn" onclick="resizePlayer(480)">M</button>
        <button class="size-btn" onclick="resizePlayer(660)">L</button>
        <button class="btn-del-cam" id="btnDeleteCam">🗑️</button>
        <button class="btn-close" id="btnClose">&times;</button>
      </div>
    </div>
    <div class="video-frame">
      <iframe id="streamIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="resize-handle" id="resizeHandle" title="Arrastra para agrandar">◢</div>
  </div>

  <script>
    const ADMIN_PASSWORD = "9066819";

    // LISTA AUDITADA Y EXACTA CON TRANSMISIONES VIVAS
    const worldCamsIniciales = [
      // CHILE
      { id: "ErUOGtBXhgY", city: "Santiago", sector: "Centro", country: "Chile", lat: -33.4489, lng: -70.6693, desc: "Capital Nacional" },
      { id: "_Nrt155MExU", city: "Santiago", sector: "Providencia", country: "Chile", lat: -33.4260, lng: -70.6120, desc: "Eje Alameda - Providencia" },
      { id: "tmS73xQ4zVc", city: "Viña del Mar", sector: "Borde Costero", country: "Chile", lat: -33.0245, lng: -71.5518, desc: "Costanera y Playa" },
      { id: "oDErMN0_ehw", city: "Valparaíso", sector: "Puerto", country: "Chile", lat: -33.0472, lng: -71.6127, desc: "Bahía y Muelle Barón" },
      { id: "M_Qk3Bv0-So", city: "La Serena", sector: "Avenida del Mar", country: "Chile", lat: -29.9027, lng: -71.2519, desc: "Faro y Costanera" },
      { id: "HirKZqakDIA", city: "Concepción", sector: "Centro", country: "Chile", lat: -36.8270, lng: -73.0503, desc: "Biobío Urbano" },

      // SUDAMÉRICA
      { id: "5Xl6pSgiy3A", city: "Río de Janeiro", sector: "Copacabana", country: "Brasil", lat: -22.9711, lng: -43.1822, desc: "Playa Copacabana en Vivo" },
      { id: "NfsyRx50gAI", city: "Buenos Aires", sector: "Obelisco", country: "Argentina", lat: -34.6037, lng: -58.3816, desc: "Avenida 9 de Julio / Obelisco" },

      // EUROPA & RUSIA
      { id: "w_Dg2vC0tUE", city: "Moscú", sector: "Plaza Roja", country: "Rusia", lat: 55.7558, lng: 37.6173, desc: "Plaza Roja y Kremlin" },
      { id: "IRqboacDNFg", city: "Berlín", sector: "Puerta de Brandeburgo", country: "Alemania", lat: 52.5163, lng: 13.3777, desc: "Puerta de Brandeburgo" },
      { id: "asO_10T0k2k", city: "Cannes", sector: "Playa", country: "Francia", lat: 43.5528, lng: 7.0174, desc: "Costa Azul / Boulevard de la Croisette" },
      { id: "2GgaZAqFE5U", city: "Londres", sector: "Tower Bridge", country: "Reino Unido", lat: 51.5055, lng: -0.0754, desc: "Tower Bridge y Río Támesis" },
      { id: "mt7uE-n0YPI", city: "Venecia", sector: "Puente Rialto", country: "Italia", lat: 45.4371, lng: 12.3326, desc: "Gran Canal de Venecia" },

      // ESTADOS UNIDOS
      { id: "EO_1LWqsCNE", city: "Los Ángeles", sector: "Venice Beach", country: "Estados Unidos", lat: 33.9850, lng: -118.4695, desc: "Boardwalk California" },
      { id: "JQ_jwk_7OVE", city: "Nueva York", sector: "Times Square", country: "Estados Unidos", lat: 40.7580, lng: -73.9855, desc: "Times Square North 4K" }
    ];

    // Clave v3 para asegurar que no se hereden posiciones erróneas en el navegador
    let worldCams = JSON.parse(localStorage.getItem('earthcam_garden_cams_v3')) || worldCamsIniciales;
    localStorage.setItem('earthcam_garden_cams_v3', JSON.stringify(worldCams));

    let isAdmin = sessionStorage.getItem('is_admin') === 'true';
    let currentSelectedCam = null;
    let isAutoRotating = false;

    const playerDock = document.getElementById('playerDock');
    const playerDragHeader = document.getElementById('playerDragHeader');
    const resizeHandle = document.getElementById('resizeHandle');
    const streamTitle = document.getElementById('streamTitle');
    const streamCoords = document.getElementById('streamCoords');
    const streamIframe = document.getElementById('streamIframe');
    const btnYtDirect = document.getElementById('btnYtDirect');
    const btnClose = document.getElementById('btnClose');

    const btnToggleCities = document.getElementById('btnToggleCities');
    const dropdownCities = document.getElementById('dropdownCities');
    const btnToggleRotate = document.getElementById('btnToggleRotate');

    const inputCitySearch = document.getElementById('inputCitySearch');
    const btnSearchCity = document.getElementById('btnSearchCity');

    const btnAdmin = document.getElementById('btnAdmin');
    const btnToggleAdd = document.getElementById('btnToggleAdd');
    const btnExportCam = document.getElementById('btnExportCam');
    const adminModal = document.getElementById('adminModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const formAddWorldCam = document.getElementById('formAddWorldCam');
    const btnSubmitCam = document.getElementById('btnSubmitCam');
    const btnDeleteCam = document.getElementById('btnDeleteCam');

    // GLOBO ESTÁTICO, SIN CILINDROS 3D Y CON RESPUESTA DIRECTA A CLICS
    const globe = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .atmosphereColor('#00ff66')
      .atmosphereAltitude(0.18)
      
      // PUNTOS VERDES PLANOS (ALTURA 0) Y CLICABLES
      .pointsData(worldCams)
      .pointLat(d => d.lat)
      .pointLng(d => d.lng)
      .pointAltitude(0)
      .pointRadius(0.85)
      .pointColor(() => '#00ff66')
      .pointLabel(d => `
        <div class="custom-tooltip">
          <b>🟢 ${d.city}</b> (${d.country})<br/>
          <span style="color:#00ff66;">${d.sector ? d.sector + ' • ' : ''}${d.desc}</span><br/>
          <small style="color:#cbd5e1;">Haz clic para ver la cámara</small>
        </div>
      `)
      .onPointClick(d => selectCamera(d))

      // ONDA SUTIL (BRILLO EN EL PUNTO)
      .ringsData(worldCams)
      .ringLat(d => d.lat)
      .ringLng(d => d.lng)
      .ringColor(() => (t) => `rgba(0, 255, 102, ${1 - t * 0.9})`)
      .ringMaxRadius(0.8)
      .ringPropagationSpeed(1.2)
      .ringRepeatPeriod(1300);

    globe.controls().autoRotate = false;
    globe.controls().autoRotateSpeed = 0.4;
    globe.pointOfView({ lat: -33.4489, lng: -70.6693, altitude: 2.2 }, 1500);

    btnToggleRotate.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      globe.controls().autoRotate = isAutoRotating;
      btnToggleRotate.textContent = isAutoRotating ? '⏸ PAUSAR' : '▶ GIRO';
      btnToggleRotate.style.borderColor = isAutoRotating ? 'var(--accent)' : 'var(--border)';
    });

    function refreshGlobeData() {
      globe.pointsData(worldCams);
      globe.ringsData(worldCams);
      renderDropdownCities();
    }

    function renderDropdownCities() {
      dropdownCities.innerHTML = '';
      worldCams.forEach(cam => {
        const item = document.createElement('button');
        item.className = 'dropdown-item';
        const label = cam.sector ? `${cam.city} (${cam.sector})` : cam.city;
        item.innerHTML = `<span>🟢 ${label}</span> <small style="color:var(--muted);">${cam.country}</small>`;
        item.addEventListener('click', () => {
          dropdownCities.classList.remove('open');
          selectCamera(cam);
        });
        dropdownCities.appendChild(item);
      });
    }

    btnToggleCities.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownCities.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownCities.contains(e.target) && e.target !== btnToggleCities) {
        dropdownCities.classList.remove('open');
      }
    });

    function selectCamera(cam) {
      currentSelectedCam = cam;
      globe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 0.95 }, 1500);

      const sectorStr = cam.sector ? `[${cam.sector}] ` : '';
      streamTitle.textContent = `${cam.city} - ${sectorStr}${cam.desc}`;
      streamCoords.textContent = `${cam.lat.toFixed(2)}° Lat, ${cam.lng.toFixed(2)}° Lng • ${cam.country}`;
      streamIframe.src = `https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=1&mute=1&controls=1&rel=0`;
      btnYtDirect.href = `https://www.youtube.com/watch?v=${cam.id}`;

      if (isAdmin) {
        btnDeleteCam.style.display = 'inline-block';
      }

      playerDock.classList.add('active');
    }

    btnClose.addEventListener('click', () => {
      playerDock.classList.remove('active');
      streamIframe.src = '';
      currentSelectedCam = null;
      btnDeleteCam.style.display = 'none';
      globe.pointOfView({ altitude: 2.2 }, 1500);
    });

    let isDragging = false;
    let dragStartX, dragStartY, initialLeft, initialTop;

    playerDragHeader.addEventListener('mousedown', (e) => {
      if (e.target.closest('.header-btns')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      const rect = playerDock.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      playerDock.style.bottom = 'auto';
      playerDock.style.right = 'auto';
      playerDock.style.left = `${initialLeft}px`;
      playerDock.style.top = `${initialTop}px`;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      newLeft = Math.max(10, Math.min(window.innerWidth - playerDock.offsetWidth - 10, newLeft));
      newTop = Math.max(10, Math.min(window.innerHeight - playerDock.offsetHeight - 10, newTop));

      playerDock.style.left = `${newLeft}px`;
      playerDock.style.top = `${newTop}px`;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.resizePlayer = function(widthPx) {
      playerDock.style.width = `${Math.min(widthPx, window.innerWidth - 40)}px`;
    };

    let isResizing = false;
    let resizeStartX, startWidth;

    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizeStartX = e.clientX;
      startWidth = playerDock.offsetWidth;
      e.preventDefault();
      e.stopPropagation();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const deltaX = e.clientX - resizeStartX;
      const newWidth = Math.max(280, Math.min(window.innerWidth * 0.9, startWidth + deltaX));
      playerDock.style.width = `${newWidth}px`;
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
    });

    async function searchAndFlyToCity(cityName) {
      if (!cityName.trim()) return;

      const camExist = worldCams.find(c => c.city.toLowerCase().includes(cityName.toLowerCase()));
      if (camExist) {
        selectCamera(camExist);
        return;
      }

      btnSearchCity.textContent = '...';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityName)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          globe.pointOfView({ lat: lat, lng: lng, altitude: 1.1 }, 2000);
        } else {
          alert('No encontramos esa ciudad en el mapa.');
        }
      } catch (err) {
        alert('Error al localizar la ciudad.');
      } finally {
        btnSearchCity.textContent = 'IR';
      }
    }

    btnSearchCity.addEventListener('click', () => searchAndFlyToCity(inputCitySearch.value));
    inputCitySearch.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchAndFlyToCity(inputCitySearch.value);
    });

    function extractYouTubeID(url) {
      if (url.length === 11 && !url.includes('/') && !url.includes('.')) return url;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.trim().match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    btnAdmin.addEventListener('click', () => {
      if (isAdmin) {
        if (confirm('¿Cerrar sesión de administrador?')) {
          isAdmin = false;
          sessionStorage.removeItem('is_admin');
          actualizarVistaAdmin();
        }
      } else {
        const pass = prompt('Ingresa la contraseña de administrador:');
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          sessionStorage.setItem('is_admin', 'true');
          actualizarVistaAdmin();
        } else if (pass !== null) {
          alert('Contraseña incorrecta.');
        }
      }
    });

    function actualizarVistaAdmin() {
      if (isAdmin) {
        btnAdmin.textContent = '🔓 CERRAR';
        btnAdmin.classList.add('active');
        btnToggleAdd.style.display = 'inline-block';
        btnExportCam.style.display = 'inline-block';
        if (currentSelectedCam) btnDeleteCam.style.display = 'inline-block';
      } else {
        btnAdmin.textContent = '🔒 ADMIN';
        btnAdmin.classList.remove('active');
        btnToggleAdd.style.display = 'none';
        btnExportCam.style.display = 'none';
        adminModal.classList.remove('open');
        btnDeleteCam.style.display = 'none';
      }
    }

    // EXPORTACIÓN LIMPIA PARA GITHUB
    btnExportCam.addEventListener('click', () => {
      const exportList = worldCams.map(c => ({
        id: c.id,
        city: c.city,
        sector: c.sector,
        country: c.country,
        lat: c.lat,
        lng: c.lng,
        desc: c.desc
      }));
      const codigoExport = `const worldCamsIniciales = ${JSON.stringify(exportList, null, 2)};`;
      navigator.clipboard.writeText(codigoExport).then(() => {
        alert('¡Lista limpia copiada al portapapeles!\nPégala en tu archivo mundo.html de GitHub.');
      });
    });

    btnToggleAdd.addEventListener('click', () => {
      adminModal.classList.toggle('open');
      if (adminModal.classList.contains('open')) {
        document.getElementById('worldCamUrl').focus();
      }
    });

    btnCloseModal.addEventListener('click', () => {
      adminModal.classList.remove('open');
    });

    formAddWorldCam.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawUrl = document.getElementById('worldCamUrl').value;
      const desc = document.getElementById('worldCamTitle').value.trim();
      const city = document.getElementById('worldCamCity').value.trim();
      const country = document.getElementById('worldCamCountry').value.trim();

      const videoId = extractYouTubeID(rawUrl);
      if (!videoId) return alert('Enlace de YouTube no válido.');

      btnSubmitCam.disabled = true;
      btnSubmitCam.textContent = 'LOCALIZANDO EN EL PLANETA...';

      try {
        const geoQuery = `${city}, ${country}`;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(geoQuery)}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);

          const newCam = { id: videoId, city, sector: desc, country, lat, lng, desc };
          worldCams.unshift(newCam);
          localStorage.setItem('earthcam_garden_cams_v3', JSON.stringify(worldCams));

          refreshGlobeData();
          formAddWorldCam.reset();
          adminModal.classList.remove('open');
          selectCamera(newCam);
        } else {
          alert('No pudimos geolocalizar esa ciudad.');
        }
      } catch (err) {
        alert('Error al contactar el mapa.');
      } finally {
        btnSubmitCam.disabled = false;
        btnSubmitCam.textContent = 'GEOLOCALIZAR Y CLAVAR';
      }
    });

    btnDeleteCam.addEventListener('click', () => {
      if (!isAdmin || !currentSelectedCam) return;
      if (confirm(`¿Eliminar la cámara "${currentSelectedCam.city} - ${currentSelectedCam.desc}"?`)) {
        worldCams = worldCams.filter(c => c !== currentSelectedCam);
        localStorage.setItem('earthcam_garden_cams_v3', JSON.stringify(worldCams));
        refreshGlobeData();
        btnClose.click();
      }
    });

    window.addEventListener('resize', () => {
      globe.width(window.innerWidth).height(window.innerHeight);
    });

    refreshGlobeData();
    actualizarVistaAdmin();
  </script>
</body>
</html>
