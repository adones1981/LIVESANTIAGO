<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Live Cams | Explorador Global</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Dependencias Globe.gl / Three.js -->
  <script src="//unpkg.com/three"></script>
  <script src="//unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 21, 35, 0.88);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00e5ff; /* Color cian original de Chile / Mundo */
      --accent-glow: rgba(0, 229, 255, 0.35);
      --live-red: #ff334b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* HEADER ORIGINAL */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(10, 15, 26, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }

    .brand-logo {
      width: 36px; height: 36px; border-radius: 8px;
      background: rgba(0, 229, 255, 0.1); border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    .brand-logo svg { width: 18px; height: 18px; fill: var(--accent); }
    .brand-text h1 { font-size: 1.15rem; font-weight: 700; color: #fff; line-height: 1.2; }
    .brand-text h1 span { color: var(--accent); }

    .btn-chile {
      background: linear-gradient(135deg, rgba(0, 255, 204, 0.15), rgba(0, 229, 255, 0.25));
      border: 1px solid var(--accent);
      color: #fff; padding: 0.5rem 1rem; border-radius: 8px;
      font-size: 0.82rem; font-weight: 700; text-decoration: none;
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace; transition: all 0.25s ease;
    }

    .btn-chile:hover { background: var(--accent); color: #07090e; }

    /* MINI RADIO DELOREAN CON TODAS LAS ESTACIONES */
    .mini-radio-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .mini-radio-title {
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .mini-radio-screen {
      background: #0d0d0d;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 3px 6px;
      width: 200px;
      overflow: hidden;
      white-space: nowrap;
    }

    .mini-marquee {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      color: #ff334b;
      padding-left: 100%;
      animation: mini-scroll 16s linear infinite;
    }

    @keyframes mini-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .btn-radio-play {
      background: var(--accent);
      color: #050811;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-vol-slider { width: 55px; height: 4px; accent-color: var(--accent); cursor: pointer; }

    .mini-stations-group {
      display: flex;
      gap: 3px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      padding-left: 6px;
      overflow-x: auto;
      max-width: 320px;
    }

    .btn-mini-station {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-mini-station.active {
      background: var(--accent);
      color: #050811;
      border-color: var(--accent);
      font-weight: bold;
    }

    /* GLOBO */
    #globeViz {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* LISTA LATERAL IZQUIERDA */
    .sidebar-links {
      position: absolute;
      left: 1.5rem; /* Ubicado a la izquierda */
      top: 5.5rem;
      width: 290px;
      max-height: calc(100vh - 7rem);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .sidebar-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header span { color: var(--accent); }

    .links-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .links-list::-webkit-scrollbar { width: 4px; }
    .links-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .world-cam-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .world-cam-link:hover, .world-cam-link.active {
      background: rgba(0, 229, 255, 0.1);
      border-color: var(--accent);
      color: #fff;
      transform: translateX(3px);
    }

    .link-city-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-country-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      text-transform: uppercase;
      background: rgba(0, 229, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* REPRODUCTOR FLOTANTE COMPACTO */
    .modal-player-float {
      position: absolute;
      bottom: 2rem;
      right: 1.5rem;
      width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 10px 40px rgba(0, 229, 255, 0.25);
      display: none;
    }

    .modal-player-bar {
      padding: 0.5rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid var(--border);
    }

    .modal-player-bar span {
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-close-player {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
    }

    .btn-close-player:hover { color: #fff; }

    .video-frame-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .video-frame-box iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    #radioHiddenPlayer {
      position: absolute;
      top: -1000px;
      left: -1000px;
      width: 1px;
      height: 1px;
    }

    @media (max-width: 768px) {
      .sidebar-links { width: calc(100% - 3rem); height: 210px; top: auto; bottom: 1rem; }
      .modal-player-float { width: calc(100% - 3rem); right: 1.5rem; bottom: 230px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg></div>
      <div class="brand-text">
        <h1>MUNDO <span>EN VIVO</span></h1>
      </div>

      <!-- MINI RADIO DELOREAN (CON TODAS LAS EMISORAS RECUPERADAS) -->
      <div class="mini-radio-bar">
        <span class="mini-radio-title">⚡ RADIO DELOREAN</span>
        <div class="mini-radio-screen">
          <div class="mini-marquee">
            RADIO DELOREAN LA RADIO DEL FUTURO - CLASICOS DE LOS 80S Y 90S - EMISORAS GLOBALES 24/7 ⚡
          </div>
        </div>
        <button class="btn-radio-play" id="btnMiniRadioPlay" onclick="toggleMiniRadio()" title="Reproducir / Pausar">▶</button>
        <input type="range" class="mini-vol-slider" id="miniRadioVol" min="0" max="100" value="50" title="Volumen">
        
        <div class="mini-stations-group">
          <button class="btn-mini-station active" id="btn_st_BuB9SaS2cWE" onclick="switchMiniStation('BuB9SaS2cWE', this)">1985</button>
          <button class="btn-mini-station" id="btn_st_Nt27aBceerI" onclick="switchMiniStation('Nt27aBceerI', this)">ROCK</button>
          <button class="btn-mini-station" id="btn_st_34H1XIjnfKM" onclick="switchMiniStation('34H1XIjnfKM', this)">TECHNO</button>
          <button class="btn-mini-station" id="btn_st_8UM7FNEbiYs" onclick="switchMiniStation('8UM7FNEbiYs', this)">1955</button>
          <button class="btn-mini-station" id="btn_st_3LWMFjRZQ6k" onclick="switchMiniStation('3LWMFjRZQ6k', this)">METAL</button>
          <button class="btn-mini-station" id="btn_st_W19rDfegcvM" onclick="switchMiniStation('W19rDfegcvM', this)">HEAVY</button>
          <button class="btn-mini-station" id="btn_st__kse217FeQ0" onclick="switchMiniStation('_kse217FeQ0', this)">2015</button>
          <button class="btn-mini-station" id="btn_st_TSyjyTGoDro" onclick="switchMiniStation('TSyjyTGoDro', this)">1885</button>
        </div>
      </div>

      <div id="radioHiddenPlayer"></div>
    </div>

    <!-- ENLACE NATIVO DIRECTO A CHILE (SALIDA LIMPIA FUERA DE IFRAME) -->
    <a href="index.html" target="_top" class="btn-chile">🇨🇱 VOLVER A CHILE</a>
  </header>

  <!-- GLOBO INTERACTIVO -->
  <div id="globeViz"></div>

  <!-- LISTA LATERAL A LA IZQUIERDA (SOLO ENLACES PLANOS) -->
  <aside class="sidebar-links">
    <div class="sidebar-header">
      <span>🌐 CÁMARAS GLOBALES</span>
      <small style="color:var(--muted); font-size:0.65rem;">DIRECTORIO</small>
    </div>
    <div class="links-list" id="worldLinksList"></div>
  </aside>

  <!-- REPRODUCTOR FLOTANTE -->
  <div class="modal-player-float" id="modalPlayerFloat">
    <div class="modal-player-bar">
      <span id="playerCamTitle">Cámara en Vivo</span>
      <button class="btn-close-player" onclick="cerrarReproductor()">&times;</button>
    </div>
    <div class="video-frame-box">
      <iframe id="playerIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    /* COMPROBACIÓN ANTI-IFRAME: Si la página intenta abrirse dentro de un iframe en index, fuerza la salida completa */
    if (window.top !== window.self) {
      window.top.location.href = window.location.href;
    }

    /* DIRECTORIO DE CÁMARAS DEL MUNDO */
    const camarasMundo = [
      { id: "1-iS7_G1978", titulo: "Times Square", ciudad: "Nueva York", pais: "EE.UU.", lat: 40.7580, lng: -73.9855 },
      { id: "DDU-rZs-Ic4", titulo: "Torre Eiffel", ciudad: "París", pais: "Francia", lat: 48.8584, lng: 2.2945 },
      { id: "w_MsnGffp0U", titulo: "Cruce Shibuya", ciudad: "Tokio", pais: "Japón", lat: 35.6595, lng: 139.7005 },
      { id: "49936C_mD18", titulo: "Gran Canal", ciudad: "Venecia", pais: "Italia", lat: 45.4408, lng: 12.3155 },
      { id: "51O_5zP0eXo", titulo: "Copacabana", ciudad: "Río de Janeiro", pais: "Brasil", lat: -22.9711, lng: -43.1822 },
      { id: "mRe-5144c4g", titulo: "Coliseo", ciudad: "Roma", pais: "Italia", lat: 41.8902, lng: 12.4922 },
      { id: "gK6A0K2zQz4", titulo: "Plaza Mayor", ciudad: "Madrid", pais: "España", lat: 40.4154, lng: -3.7074 },
      { id: "vXKn4qUQFMA", titulo: "Santiago Providencia", ciudad: "Santiago", pais: "Chile", lat: -33.4489, lng: -70.6693 }
    ];

    /* GLOBO 3D CON PUNTOS PLANOS VERDES 2D */
    let worldGlobe;
    function initGlobe() {
      const elem = document.getElementById('globeViz');
      worldGlobe = Globe()(elem)
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .pointsData(camarasMundo)
        .pointLat('lat')
        .pointLng('lng')
        .pointColor(() => '#00ff66') // Puntos planos verdes
        .pointAltitude(0.01)
        .pointRadius(0.9)
        .pointLabel(d => `<div style="background:#0a1121;border:1px solid #00ff66;padding:4px 8px;border-radius:4px;color:#fff;font-family:monospace;font-size:11px;">🟢 ${d.titulo} - ${d.ciudad}</div>`)
        .onPointClick(point => {
          seleccionarCamara(point);
        });

      worldGlobe.pointOfView({ lat: 15, lng: -60, altitude: 2.2 });
      worldGlobe.controls().autoRotate = true;
      worldGlobe.controls().autoRotateSpeed = 0.35;
    }

    /* RENDER DE ENLACES EN EL PANEL IZQUIERDO */
    const linksContainer = document.getElementById('worldLinksList');
    function renderLinks() {
      linksContainer.innerHTML = '';
      camarasMundo.forEach(cam => {
        const link = document.createElement('div');
        link.className = 'world-cam-link';
        link.id = `link_${cam.id}`;
        link.innerHTML = `
          <span class="link-city-title">📍 ${cam.ciudad} - ${cam.titulo}</span>
          <span class="link-country-badge">${cam.pais}</span>
        `;
        link.addEventListener('click', () => {
          seleccionarCamara(cam);
        });
        linksContainer.appendChild(link);
      });
    }

    /* SELECCIONAR CÁMARA */
    const playerBox = document.getElementById('modalPlayerFloat');
    const playerTitle = document.getElementById('playerCamTitle');
    const playerIframe = document.getElementById('playerIframe');

    function seleccionarCamara(cam) {
      document.querySelectorAll('.world-cam-link').forEach(l => l.classList.remove('active'));
      const activeLink = document.getElementById(`link_${cam.id}`);
      if (activeLink) activeLink.classList.add('active');

      if (worldGlobe) {
        worldGlobe.controls().autoRotate = false;
        worldGlobe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 1.4 }, 1200);
      }

      playerTitle.textContent = `${cam.titulo.toUpperCase()} (${cam.ciudad}, ${cam.pais})`;
      playerIframe.src = `https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=1&mute=1&rel=0`;
      playerBox.style.display = 'block';
    }

    function cerrarReproductor() {
      playerBox.style.display = 'none';
      playerIframe.src = '';
      document.querySelectorAll('.world-cam-link').forEach(l => l.classList.remove('active'));
      if (worldGlobe) worldGlobe.controls().autoRotate = true;
    }

    /* RADIO DELOREAN */
    let radioAudioPlayer = null;
    let currentStationId = localStorage.getItem('radio_delorean_station') || 'BuB9SaS2cWE';
    let savedVol = parseInt(localStorage.getItem('radio_delorean_vol') || '50', 10);
    let shouldAutoPlay = localStorage.getItem('radio_delorean_playing') === 'true';

    (function initRadioApi() {
      const ytScript = document.createElement('script');
      ytScript.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(ytScript);
    })();

    window.onYouTubeIframeAPIReady = function() {
      radioAudioPlayer = new YT.Player('radioHiddenPlayer', {
        height: '1', width: '1', videoId: currentStationId,
        playerVars: { autoplay: shouldAutoPlay ? 1 : 0, controls: 0 },
        events: { 
          'onReady': () => {
            radioAudioPlayer.setVolume(savedVol);
            document.getElementById('miniRadioVol').value = savedVol;
            if (shouldAutoPlay) {
              radioAudioPlayer.playVideo();
              document.getElementById('btnMiniRadioPlay').textContent = '⏸';
            }
            actualizarBotonEstacion(currentStationId);
          } 
        }
      });
    };

    function toggleMiniRadio() {
      if (!radioAudioPlayer || typeof radioAudioPlayer.getPlayerState !== 'function') return;
      const btn = document.getElementById('btnMiniRadioPlay');
      if (radioAudioPlayer.getPlayerState() === 1) {
        radioAudioPlayer.pauseVideo();
        btn.textContent = '▶';
        localStorage.setItem('radio_delorean_playing', 'false');
      } else {
        radioAudioPlayer.playVideo();
        btn.textContent = '⏸';
        localStorage.setItem('radio_delorean_playing', 'true');
      }
    }

    function switchMiniStation(videoId, btnEl) {
      currentStationId = videoId;
      localStorage.setItem('radio_delorean_station', videoId);
      const btnPlay = document.getElementById('btnMiniRadioPlay');

      if (radioAudioPlayer && typeof radioAudioPlayer.loadVideoById === 'function') {
        radioAudioPlayer.loadVideoById(videoId);
        btnPlay.textContent = '⏸';
        localStorage.setItem('radio_delorean_playing', 'true');
      }
      actualizarBotonEstacion(videoId);
    }

    function actualizarBotonEstacion(videoId) {
      document.querySelectorAll('.btn-mini-station').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn_st_' + videoId);
      if (activeBtn) activeBtn.classList.add('active');
    }

    document.getElementById('miniRadioVol').addEventListener('input', (e) => {
      const vol = e.target.value;
      localStorage.setItem('radio_delorean_vol', vol);
      if (radioAudioPlayer && typeof radioAudioPlayer.setVolume === 'function') {
        radioAudioPlayer.setVolume(vol);
      }
    });

    window.addEventListener('resize', () => {
      if (worldGlobe) worldGlobe.width(window.innerWidth).height(window.innerHeight);
    });

    document.addEventListener('DOMContentLoaded', () => {
      initGlobe();
      renderLinks();
    });
  </script>
</body>
</html>
