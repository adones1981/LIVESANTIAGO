<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Cam | Global Live Streams</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Motor Globe.gl estable -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.35.1/dist/globe.gl.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --accent: #059669;
      --accent-glow: rgba(5, 150, 105, 0.3);
      --card-bg: rgba(255, 255, 255, 0.95);
      --border: rgba(0, 0, 0, 0.1);
      --text: #1f2937;
      --text-bright: #111827;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #f1f5f9;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    /* PANEL LATERAL IZQUIERDO */
    aside {
      width: 320px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      z-index: 30;
      box-shadow: 5px 0 30px rgba(0,0,0,0.05);
    }

    .brand-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-bright);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }

    .brand-title h1 span {
      color: var(--accent);
    }

    .dropdown-container {
      position: relative;
      width: 100%;
    }

    .select-simulated {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .select-simulated:hover {
      border-color: var(--accent);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      max-height: 48vh;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 0.3rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      z-index: 50;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      text-align: left;
      cursor: pointer;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(5, 150, 105, 0.1);
      color: var(--accent);
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sidebar-label {
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.8px;
    }

    .search-box-side {
      display: flex;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      gap: 0.5rem;
      align-items: center;
    }

    .search-box-side input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-bright);
      font-size: 0.8rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 100%;
      user-select: text;
    }

    .btn-dial {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.1s;
    }

    .btn-dial:active {
      transform: scale(0.98);
    }

    .sidebar-footer-info {
      margin-top: auto;
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
      padding: 0.5rem;
      border-top: 1px solid var(--border);
    }

    /* CONTENEDOR DEL GLOBO (MAPA CLARO Y VISIBLE) */
    #viewerContainer {
      flex: 1;
      height: 100vh;
      position: relative;
      background: #e2e8f0;
    }

    #globeViz {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #globeViz:active {
      cursor: grabbing;
    }

    /* LEYENDA DE POPULARIDAD */
    .popularity-legend {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      z-index: 20;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .popularity-legend h4 {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* TARJETA FLOTANTE DE REPRODUCCIÓN */
    .player-dock {
      position: fixed;
      top: 50%;
      left: 55%;
      transform: translate(-50%, -50%);
      width: 440px;
      max-width: 90vw;
      background: #ffffff;
      backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 16px;
      z-index: 40;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .player-dock.active {
      display: flex;
    }

    .player-header {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }

    .live-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 700;
    }

    .live-tag::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .card-close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .card-close-btn:hover {
      color: var(--text-bright);
    }

    .location-info h2 {
      font-size: 1.15rem;
      color: var(--text-bright);
      font-weight: 700;
    }

    .location-info p {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .badges-row {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .badge-pill {
      background: #e2e8f0;
      border-radius: 20px;
      padding: 0.15rem 0.6rem;
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
    }

    .action-play-container {
      padding: 1rem;
    }

    .btn-play-big {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-play-big:hover {
      background: #047857;
    }

    .video-container-modal {
      display: none;
      margin-top: 0.75rem;
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container-modal.show {
      display: block;
    }

    .video-container-modal iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* PINES Y ETIQUETAS EN EL MAPA */
    .cam-marker-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      z-index: 5;
    }

    .cam-pin {
      width: 12px;
      height: 12px;
      background: var(--accent);
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(5, 150, 105, 0.8);
      transition: transform 0.18s ease;
    }

    .cam-marker-wrap:hover .cam-pin {
      transform: scale(1.5);
    }

    .map-city-label {
      margin-top: 3px;
      color: var(--text-bright);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 9px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(255,255,255,0.9);
      background: rgba(255, 255, 255, 0.9);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    /* CONTROLES SUPERIORES */
    .top-controls {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 20;
      display: flex;
      gap: 0.5rem;
    }

    .btn-ctrl-top {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .btn-ctrl-top:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- PANEL LATERAL IZQUIERDO -->
  <aside>
    <div class="brand-area">
      <div class="brand-title">
        <h1>LIVE <span>CAM</span></h1>
      </div>
      <a href="index.html" style="color:var(--accent); font-size:0.75rem; font-family:'JetBrains Mono',monospace; text-decoration:none;">← INICIO</a>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-label">SELECCIÓN RÁPIDA</span>
      <div class="dropdown-container">
        <div class="select-simulated" id="btnToggleCities">
          <span id="selectedDropdownText">Seleccionar cámara...</span>
          <span>▼</span>
        </div>
        <div class="dropdown-menu" id="dropdownCities"></div>
      </div>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-label">BÚSQUEDA GLOBAL</span>
      <div class="search-box-side">
        <input type="text" id="inputCitySearch" placeholder="Ej. Paris, London, Santiago...">
      </div>
    </div>

    <button class="btn-dial" id="btnSearchCity">BUSCAR EN EL ORBE</button>

    <div class="sidebar-section" style="margin-top: 1rem;">
      <span class="sidebar-label">ADMINISTRACIÓN</span>
      <div style="display:flex; gap:0.4rem;">
        <button class="btn-ctrl-top" id="btnAdmin" style="flex:1; background:#f8fafc;">🔒 ADMIN</button>
        <button class="btn-ctrl-top" id="btnResetCam" title="Restaurar" style="flex:1; background:#f8fafc;">🔄 RESET</button>
      </div>
    </div>

    <div class="sidebar-footer-info">
      Live Cam Global v6.0
    </div>
  </aside>

  <!-- CONTENEDOR PRINCIPAL DEL GLOBO -->
  <div id="viewerContainer">
    <div class="top-controls">
      <button class="btn-ctrl-top" id="btnToggleRotate">▶ GIRO AUTOMÁTICO</button>
    </div>

    <div id="globeViz"></div>

    <!-- LEYENDA DE POPULARIDAD -->
    <div class="popularity-legend">
      <h4>POPULARIDAD</h4>
      <div class="legend-item"><div class="legend-dot" style="background:#ff334b;"></div>Top mundial</div>
      <div class="legend-item"><div class="legend-dot" style="background:#059669;"></div>Alta (+5k)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#38bdf8;"></div>Media</div>
      <div class="legend-item"><div class="legend-dot" style="background:#a855f7;"></div>Baja</div>
    </div>
  </div>

  <!-- TARJETA FLOTANTE DE REPRODUCCIÓN -->
  <div class="player-dock" id="playerDock">
    <div class="player-header">
      <div class="live-badge-row">
        <span class="live-tag">TRANSMISIÓN EN VIVO</span>
        <button class="card-close-btn" id="btnClose">&times;</button>
      </div>
      <div class="location-info">
        <h2 id="streamTitle">Ubicación</h2>
        <p id="streamCoords">Coordenadas y detalles</p>
      </div>
      <div class="badges-row">
        <span class="badge-pill">1080p 60fps</span>
        <span class="badge-pill">YouTube Live</span>
        <span class="badge-pill" id="badgeCountry">Global</span>
      </div>
    </div>

    <div class="action-play-container">
      <button class="btn-play-big" id="btnPlayStream">▶ REPRODUCIR EN VIVO</button>
      <div class="video-container-modal" id="videoContainerModal">
        <iframe id="streamIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "9066819";
    const STORAGE_KEY = "livecam_garden_cams_v8";

    // CÁMARAS VERIFICADAS CON UBICACIONES EXACTAS DIFERENCIADAS EN SANTIAGO Y EL MUNDO
    const worldCamsIniciales = [
      {
        id: "ErUOGtBXhgY",
        city: "Santiago",
        sector: "Plaza Baquedano (Zona Cero)",
        country: "Chile",
        lat: -33.4372,
        lng: -70.6345,
        desc: "Galería CIMA - Plaza Baquedano / Centro"
      },
      {
        id: "_Nrt155MExU",
        city: "Santiago",
        sector: "Tobalaba / Providencia",
        country: "Chile",
        lat: -33.4228,
        lng: -70.6053,
        desc: "Eje Tobalaba - Av. Providencia y Sector Financiero"
      },
      {
        id: "tmS73xQ4zVc",
        city: "Lo Barnechea",
        sector: "Valle Nevado",
        country: "Chile",
        lat: -33.3547,
        lng: -70.2498,
        desc: "Valle Nevado Ski Resort (Cordillera de Los Andes)"
      },
      {
        id: "7dc4Y_Vb_Wc",
        city: "Río de Janeiro",
        sector: "Copacabana",
        country: "Brasil",
        lat: -22.9711,
        lng: -43.1822,
        desc: "Avenida Atlântica y Playa Copacabana"
      },
      {
        id: "JQ_jwk_7OVE",
        city: "Nueva York",
        sector: "Times Square",
        country: "Estados Unidos",
        lat: 40.7580,
        lng: -73.9855,
        desc: "EarthCam: Times Square 4K Live"
      },
      {
        id: "EO_1LWqsCNE",
        city: "Los Ángeles",
        sector: "Venice Beach",
        country: "Estados Unidos",
        lat: 33.9850,
        lng: -118.4695,
        desc: "Venice Beach Boardwalk Live Cam"
      },
      {
        id: "asO_10T0k2k",
        city: "París",
        sector: "Torre Eiffel",
        country: "Francia",
        lat: 48.8584,
        lng: 2.2945,
        desc: "Paris en Direct – Tour Eiffel Live 4K"
      },
      {
        id: "mt7uE-n0YPI",
        city: "Venecia",
        sector: "Gran Canal",
        country: "Italia",
        lat: 45.4380,
        lng: 12.3359,
        desc: "Puente de Rialto y Gran Canal en vivo"
      },
      {
        id: "KGuCGd726RA",
        city: "Londres",
        sector: "Abbey Road",
        country: "Reino Unido",
        lat: 51.5320,
        lng: -0.1773,
        desc: "EarthCam: Famoso cruce peatonal de Abbey Road"
      },
      {
        id: "dfVK7ld38Ys",
        city: "Tokio",
        sector: "Shinjuku",
        country: "Japón",
        lat: 35.6938,
        lng: 139.7034,
        desc: "Distrito Shinjuku y Kabukicho en vivo"
      }
    ];

    const traduccionPaises = {
      "Chile": "Chile", "Argentina": "Argentina", "Peru": "Perú", "Brazil": "Brasil",
      "United States of America": "Estados Unidos", "France": "Francia", "Spain": "España",
      "United Kingdom": "Reino Unido", "Ireland": "Irlanda", "Italy": "Italia", "Japan": "Japón"
    };

    let worldCams = JSON.parse(localStorage.getItem(STORAGE_KEY)) || worldCamsIniciales;
    let isAdmin = sessionStorage.getItem('is_admin') === 'true';
    let currentSelectedCam = null;
    let isAutoRotating = false;

    const playerDock = document.getElementById('playerDock');
    const streamTitle = document.getElementById('streamTitle');
    const streamCoords = document.getElementById('streamCoords');
    const badgeCountry = document.getElementById('badgeCountry');
    const streamIframe = document.getElementById('streamIframe');
    const videoContainerModal = document.getElementById('videoContainerModal');
    const btnPlayStream = document.getElementById('btnPlayStream');
    const btnClose = document.getElementById('btnClose');

    const btnToggleCities = document.getElementById('btnToggleCities');
    const dropdownCities = document.getElementById('dropdownCities');
    const selectedDropdownText = document.getElementById('selectedDropdownText');
    const btnToggleRotate = document.getElementById('btnToggleRotate');
    const inputCitySearch = document.getElementById('inputCitySearch');
    const btnSearchCity = document.getElementById('btnSearchCity');

    const btnAdmin = document.getElementById('btnAdmin');
    const btnResetCam = document.getElementById('btnResetCam');

    function norm(str) {
      return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    function buildMarkerData(cams) {
      const seenCities = new Set();
      return cams.map(cam => {
        const key = `${norm(cam.city)}_${norm(cam.country)}`;
        const showCityLabel = !seenCities.has(key);
        seenCities.add(key);
        return { ...cam, showCityLabel };
      });
    }

    // INICIALIZACIÓN DEL GLOBO (MAPA CLARO Y BRILLANTE)
    const globe = Globe()
      (document.getElementById('globeViz'))
      .backgroundColor('#e2e8f0')
      .showGlobe(true)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .atmosphereColor('#059669')
      .atmosphereAltitude(0.12)

      .htmlElementsData(buildMarkerData(worldCams))
      .htmlLat(d => d.lat)
      .htmlLng(d => d.lng)
      .htmlAltitude(0.004)
      .htmlElement(d => {
        const wrap = document.createElement('div');
        wrap.className = 'cam-marker-wrap';

        const pin = document.createElement('div');
        pin.className = 'cam-pin';
        wrap.appendChild(pin);

        if (d.showCityLabel) {
          const label = document.createElement('div');
          label.className = 'map-city-label';
          label.textContent = d.city;
          wrap.appendChild(label);
        }

        wrap.addEventListener('click', (e) => {
          e.stopPropagation();
          selectCamera(d);
        });

        return wrap;
      })

      .ringsData(buildMarkerData(worldCams).filter(d => d.showCityLabel))
      .ringLat(d => d.lat)
      .ringLng(d => d.lng)
      .ringAltitude(0.003)
      .ringColor(() => (t) => `rgba(5, 150, 105, ${1 - t * 0.8})`)
      .ringMaxRadius(1.2)
      .ringPropagationSpeed(1.2)
      .ringRepeatPeriod(1500);

    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(countries => {
        globe.polygonsData(countries.features)
          .polygonAltitude(0.002)
          .polygonCapColor(() => '#f8fafc')
          .polygonSideColor(() => '#e2e8f0')
          .polygonStrokeColor(() => '#cbd5e1')
          .polygonLabel(({ properties: d }) => {
            const nombrePais = traduccionPaises[d.ADMIN] || d.NAME_ES || d.ADMIN;
            return `<div style="background:#ffffff; padding:3px 8px; border-radius:4px; font-size:11px; border:1px solid #cbd5e1; color:#111827;"><b>🌍 ${nombrePais}</b></div>`;
          });
      });

    globe.width(document.getElementById('viewerContainer').clientWidth);
    globe.height(window.innerHeight);

    globe.controls().autoRotate = false;
    globe.controls().autoRotateSpeed = 0.4;
    globe.pointOfView({ lat: -33.4489, lng: -70.6693, altitude: 2.1 }, 1500);

    btnToggleRotate.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      globe.controls().autoRotate = isAutoRotating;
      btnToggleRotate.textContent = isAutoRotating ? '⏸ PAUSAR GIRO' : '▶ GIRO AUTOMÁTICO';
    });

    function refreshGlobeData() {
      const markerData = buildMarkerData(worldCams);
      globe.htmlElementsData(markerData);
      globe.ringsData(markerData.filter(d => d.showCityLabel));
      renderDropdownCities();
    }

    function renderDropdownCities() {
      dropdownCities.innerHTML = '';
      worldCams.forEach(cam => {
        const item = document.createElement('button');
        item.className = 'dropdown-item';
        const label = cam.sector ? `${cam.city} (${cam.sector})` : cam.city;
        item.innerHTML = `<span>🟢 ${label}</span> <small style="color:var(--muted);">${cam.country}</small>`;
        item.addEventListener('click', () => {
          dropdownCities.classList.remove('open');
          selectedDropdownText.textContent = label;
          selectCamera(cam);
        });
        dropdownCities.appendChild(item);
      });
    }

    btnToggleCities.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownCities.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownCities.contains(e.target) && !btnToggleCities.contains(e.target)) {
        dropdownCities.classList.remove('open');
      }
    });

    function selectCamera(cam) {
      currentSelectedCam = cam;
      globe.pointOfView({ lat: cam.lat, lng: cam.lng, altitude: 0.85 }, 1500);

      streamTitle.textContent = `${cam.city} - ${cam.sector || ''}`;
      streamCoords.textContent = cam.desc;
      badgeCountry.textContent = cam.country;
      
      videoContainerModal.classList.remove('show');
      streamIframe.src = '';
      btnPlayStream.innerHTML = '▶ REPRODUCIR EN VIVO';

      playerDock.classList.add('active');
    }

    btnPlayStream.addEventListener('click', () => {
      if (!currentSelectedCam) return;
      streamIframe.src = `https://www.youtube-nocookie.com/embed/${currentSelectedCam.id}?autoplay=1&mute=1&controls=1&rel=0`;
      videoContainerModal.classList.add('show');
      btnPlayStream.innerHTML = '⏸ REPRODUCIENDO EN VIVO';
    });

    btnClose.addEventListener('click', () => {
      playerDock.classList.remove('active');
      streamIframe.src = '';
      videoContainerModal.classList.remove('show');
      currentSelectedCam = null;
      globe.pointOfView({ altitude: 2.1 }, 1500);
    });

    async function searchAndFlyToLocation(rawQuery) {
      const q = norm(rawQuery);
      if (!q) return;

      const exactMatch = worldCams.find(c => norm(c.city) === q || norm(c.country) === q || norm(c.sector) === q || norm(c.desc).includes(q));
      if (exactMatch) {
        selectCamera(exactMatch);
        return;
      }

      const url = `https://nominatim.openstreetmap.org/search?format=json&accept-language=es&limit=1&q=${encodeURIComponent(rawQuery.trim())}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.length > 0) {
        globe.pointOfView({ lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), altitude: 1.2 }, 1800);
      } else {
        alert('No se encontró la ubicación.');
      }
    }

    btnSearchCity.addEventListener('click', () => searchAndFlyToLocation(inputCitySearch.value));
    inputCitySearch.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchAndFlyToLocation(inputCitySearch.value);
    });

    btnAdmin.addEventListener('click', () => {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem('is_admin');
        btnAdmin.textContent = '🔒 ADMIN';
      } else {
        const pass = prompt('Contraseña de administrador:');
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          sessionStorage.setItem('is_admin', 'true');
          btnAdmin.textContent = '🔓 CERRAR';
        }
      }
    });

    btnResetCam.addEventListener('click', () => {
      if (confirm('¿Restaurar cámaras oficiales?')) {
        localStorage.removeItem(STORAGE_KEY);
        worldCams = [...worldCamsIniciales];
        refreshGlobeData();
        btnClose.click();
      }
    });

    window.addEventListener('resize', () => {
      const container = document.getElementById('viewerContainer');
      globe.width(container.clientWidth).height(window.innerHeight);
    });

    refreshGlobeData();
  </script>
</body>
</html>
